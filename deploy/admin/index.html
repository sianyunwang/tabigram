<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TabigrAm 後台</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<style>
/* 果醬派對管理頁：沿用 App 的 Paper 主題（再生紙灰、國際橘） */
:root {
  --paper: #E7E5E0; --card: #F6F4F0; --card2: #EBE9E4; --ink: #191919; --sub: #6E6A63; --line: #D6D2CA;
  --accent: #FF4F00; --accent-soft: #FFE6DA; --ok: #16803C; --ok-soft: #E3F3E8; --danger: #C2381B;
  --display: 'Dela Gothic One', 'Noto Sans TC', system-ui, sans-serif;
  --sans: 'Noto Sans TC', 'PingFang TC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
a { color: inherit; }
button { font-family: var(--sans); }
.wrap { max-width: 980px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 12px; padding: 8px 0 22px; }
.ring { width: 40px; height: 40px; flex: none; background: var(--accent); -webkit-mask: url(../logo-ring.svg) center / contain no-repeat; mask: url(../logo-ring.svg) center / contain no-repeat; animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
.brand { font-family: var(--display); font-size: 22px; line-height: 1.1; }
.brand small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--accent); margin-top: 3px; }
.sp { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); min-width: 0; }
.who b { color: var(--ink); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 900; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: transform .12s ease, background .12s ease; }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.go { background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); padding: 8.5px 16px; }
.btn.soft { background: var(--card2); color: var(--ink); }
.btn.sm { font-size: 13px; padding: 7px 13px; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid #E9B9AC; padding: 7px 13px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: progress; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 34px); margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 900; margin: 0; }
.lead { color: var(--sub); margin: 0 0 22px; max-width: 40em; }
.kicker { font-family: var(--mono); font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--accent); }
.center { text-align: center; padding: 48px 22px; }
.center p { color: var(--sub); max-width: 30em; margin: 8px auto 20px; }

/* 貼紙包清單 */
.list { display: grid; gap: 12px; }
.pack { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center; }
.cover { width: 72px; height: 72px; border-radius: 20px; background: var(--card2); border: 1.5px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.cover img { width: 62px; height: 62px; object-fit: contain; }
.pack-name { font-size: 17px; font-weight: 900; }
.pack-meta { font-size: 13px; color: var(--sub); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.off { background: var(--card2); color: var(--sub); }
.pack-strip { display: flex; gap: 4px; margin-top: 8px; overflow: hidden; }
.pack-strip img { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; background: var(--card2); padding: 2px; }
.pack-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.order { display: flex; flex-direction: column; gap: 4px; }
.icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 15px; font-weight: 900; color: var(--ink); }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 12px; flex-wrap: wrap; }
.pill.star { background: var(--accent-soft); color: var(--accent); }

/* 分頁 */
.tabs { display: flex; gap: 6px; margin: -8px 0 18px; }
.tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 16px; font: 900 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tab-n { font: 800 11px var(--mono); background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; }
.tab-n:empty { display: none; }

/* 意見回饋 */
.fb-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font: 800 13px var(--sans); cursor: pointer; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.fb-search { flex: 1; min-width: 160px; font: 500 14px var(--sans); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; background: #fff; color: var(--ink); }
.fb { display: grid; gap: 6px; }
.fb.done { opacity: .55; }
.fb-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--sub); }
.fb-cat { font-size: 11.5px; font-weight: 900; border-radius: 999px; padding: 2px 9px; }
.fb-cat.bug { background: #FBE3DD; color: #B23A20; }
.fb-cat.idea { background: #E4ECF8; color: #2C4F8A; }
.fb-cat.love { background: var(--ok-soft); color: var(--ok); }
.fb-cat.other { background: var(--card2); color: var(--sub); }
.fb-msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.65; }
.fb-info { font: 500 11.5px var(--mono); color: var(--sub); overflow-wrap: anywhere; }
.fb-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fb-foot .sp { flex: 1; }

/* 編輯 */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 800; color: var(--sub); }
.field input { width: 100%; font: 500 15px var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.field input:focus { outline: none; border-color: var(--ink); }
.field .hint { font-size: 12px; color: var(--sub); }
.section { margin-top: 22px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-head p { margin: 0; font-size: 12.5px; color: var(--sub); }
.drop { display: block; border: 2px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; color: var(--sub); font-size: 13.5px; cursor: pointer; background: rgba(255,255,255,.4); transition: border-color .15s ease, background .15s ease; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop b { color: var(--ink); }
.cover-row { display: flex; gap: 14px; align-items: center; }
.cover-row .cover { width: 88px; height: 88px; border-radius: 24px; }
.cover-row .cover img { width: 78px; height: 78px; }
.stk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.stk { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 10px; display: grid; gap: 8px; }
.stk-img { height: 110px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; position: relative; }
.stk-img img { max-width: 100%; max-height: 100px; object-fit: contain; }
.stk-no { position: absolute; top: 6px; left: 8px; font: 800 11px var(--mono); color: var(--sub); }
.stk-new { position: absolute; top: 6px; right: 8px; font-size: 10.5px; font-weight: 800; color: var(--accent); }
.stk input { width: 100%; font: 500 13.5px var(--sans); border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 9px; color: var(--ink); background: var(--card); }
.stk input:focus { outline: none; border-color: var(--ink); }
.stk-tools { display: flex; gap: 6px; }
.stk-tools .icon-btn { width: 30px; height: 30px; border-radius: 10px; font-size: 13px; }
.stk-tools .rm { margin-left: auto; color: var(--danger); }
.save-bar { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); margin-top: 22px; background: var(--ink); color: var(--paper); border-radius: 20px; padding: 12px 14px 12px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.save-bar .msg { flex: 1; font-size: 13px; opacity: .85; min-width: 160px; }
.save-bar .btn.soft { background: rgba(255,255,255,.12); color: var(--paper); }

/* 右側：App 裡的樣子 */
.preview { position: sticky; top: 16px; }
.phone { background: #0E0F12; border-radius: 30px; padding: 14px; color: #fff; }
.phone-cap { font-size: 12px; color: rgba(255,255,255,.6); margin: 2px 4px 10px; }
.p-sheet { background: var(--card); color: var(--ink); border-radius: 20px; padding: 12px; }
.p-label { font-size: 11px; color: var(--sub); font-weight: 800; margin-bottom: 6px; }
.p-row { display: flex; gap: 8px; align-items: center; overflow: hidden; }
.p-cover { width: 56px; flex: none; display: grid; justify-items: center; gap: 3px; }
.p-cover span { width: 50px; height: 50px; border-radius: 15px; background: var(--card2); border: 1.5px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.p-cover img { width: 44px; height: 44px; object-fit: contain; }
.p-cover small { font-size: 9.5px; font-weight: 800; color: var(--sub); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-emo { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); flex: none; }
.p-jam { margin-top: 12px; background: var(--card); color: var(--ink); border-radius: 20px; padding: 14px; }
.p-jam-head { display: flex; gap: 10px; align-items: center; }
.p-jam-head .p-cover span { width: 54px; height: 54px; }
.p-name { font-size: 15px; font-weight: 900; line-height: 1.3; }
.p-by { font-size: 11.5px; color: var(--sub); }
.p-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
.p-grid span { aspect-ratio: 1; border-radius: 10px; background: var(--card2); display: grid; place-items: center; padding: 3px; }
.p-grid img { width: 100%; height: 100%; object-fit: contain; }
.p-empty { font-size: 12px; color: var(--sub); padding: 10px 0; }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.skeleton { height: 96px; border-radius: 22px; background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sk 1.2s ease infinite; }
@keyframes sk { to { background-position: -200% 0; } }

@media (max-width: 820px) {
  .editor { grid-template-columns: 1fr; }
  .preview { position: static; }
}
@media (max-width: 560px) {
  .fields { grid-template-columns: 1fr; }
  .pack { grid-template-columns: 56px 1fr; }
  .cover { width: 56px; height: 56px; border-radius: 16px; }
  .cover img { width: 48px; height: 48px; }
  .pack-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .order { flex-direction: row; }
  .who b { max-width: 110px; }
}

/* ===== 第三版：分頁、狀態、通用編輯器、數據 ===== */
.pill.review { background: #FFF1D6; color: #9A5B00; }
.pill.rejected { background: #FBE3DD; color: #B23A20; }
.pill.draft { background: var(--card2); color: var(--sub); }
.tabs { flex-wrap: wrap; }
.role-note { font-size: 12.5px; color: var(--sub); margin: -6px 0 16px; }
.thumb { width: 72px; height: 96px; border-radius: 14px; background: var(--card2); border: 1.5px solid var(--line); overflow: hidden; display: grid; place-items: center; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb.contain img { object-fit: contain; }
.row-card { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.row-meta { font-size: 12.5px; color: var(--sub); margin-top: 3px; }
.note-box { background: #FBE3DD; color: #B23A20; border-radius: 12px; padding: 8px 12px; font-size: 13px; margin-top: 8px; }
.spec { font-size: 12.5px; color: var(--sub); background: rgba(255,255,255,.55); border: 1px dashed var(--line); border-radius: 14px; padding: 10px 12px; line-height: 1.7; margin-top: 8px; }
.spec b { color: var(--ink); }
.slot { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: start; }
.slot + .slot { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
.slot-img { width: 110px; height: 140px; border-radius: 14px; background: repeating-conic-gradient(#E5E2DC 0 25%, #F3F1EC 0 50%) 0 0 / 16px 16px; border: 1.5px solid var(--line); overflow: hidden; display: grid; place-items: center; }
.slot-img img { width: 100%; height: 100%; object-fit: contain; }
.slot-img.sq { height: 110px; }
.slot-warn { color: #9A5B00; font-size: 12px; margin-top: 6px; }
.field textarea, .field select { width: 100%; font: 500 15px var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.field textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.check:last-child { border-bottom: 0; }
.check input { width: 18px; height: 18px; margin-top: 3px; flex: none; }
.check b { display: block; font-size: 14.5px; }
.check span { font-size: 12.5px; color: var(--sub); }
.mini-preview { border-radius: 22px; overflow: hidden; position: relative; aspect-ratio: 9 / 16; background: #ddd center / cover no-repeat; border: 1px solid var(--line); }
.mini-preview .card-paper { position: absolute; left: 9%; right: 9%; top: 22%; height: 46%; border-radius: 14px; background-size: 96px; box-shadow: 0 8px 22px rgba(0,0,0,.18); padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.mini-preview .card-paper b { font-size: 17px; }
.mini-preview .card-paper span { font-size: 12px; }
.mini-preview .overlay { position: absolute; inset: 0; background: center / 100% 100% no-repeat; pointer-events: none; }
.safe-guide { position: absolute; inset: 0; pointer-events: none; }
.safe-guide i { position: absolute; border: 1.5px dashed rgba(255,79,0,.8); border-radius: 10px; }
.pf-preview { position: relative; aspect-ratio: 1200 / 1440; border-radius: 14px; overflow: hidden; background: repeating-conic-gradient(#E5E2DC 0 25%, #F3F1EC 0 50%) 0 0 / 16px 16px; }
.pf-preview .photo { position: absolute; background: linear-gradient(135deg, #6E8FB5, #E9B872); }
.pf-preview .frame { position: absolute; inset: 0; background: center / 100% 100% no-repeat; }
.num-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.num-row input { width: 100%; }
/* Zine 區塊編輯 */
.blk { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 8px; }
.blk + .blk { margin-top: 10px; }
.blk-head { display: flex; align-items: center; gap: 6px; }
.blk-head .kicker { flex: 1; }
.blk textarea, .blk input { width: 100%; font: 500 14.5px var(--sans); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--card); color: var(--ink); }
.blk textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
.blk-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.blk-img { display: flex; gap: 10px; align-items: center; }
.blk-img img { width: 120px; height: 80px; object-fit: cover; border-radius: 10px; background: var(--card2); }
/* 數據 */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.kpi .v { font: 900 30px/1.1 var(--sans); }
.kpi .l { font-size: 12.5px; color: var(--sub); margin-top: 4px; }
.kpi .s { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.chart-card h2 { font-size: 15px; margin-bottom: 10px; }
.cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--line); padding-top: 6px; position: relative; }
.cols .c { flex: 1; min-width: 3px; background: var(--accent); border-radius: 4px 4px 0 0; position: relative; }
.cols .c:hover { opacity: .75; }
.cols-x { display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--sub); margin-top: 4px; }
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; }
.hbar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .t { height: 10px; background: var(--card2); border-radius: 5px; overflow: hidden; }
.hbar .t i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.hbar .v { font: 700 12.5px var(--mono); color: var(--ink); text-align: right; min-width: 3.2em; }
.empty-note { font-size: 13px; color: var(--sub); padding: 8px 0; }
.tip { position: fixed; pointer-events: none; z-index: 200; background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 9px; border-radius: 8px; transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; display: none; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
table.mini th, table.mini td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); }
table.mini th { font-size: 12px; color: var(--sub); font-weight: 800; }
@media (max-width: 560px) { .row-card { grid-template-columns: auto 1fr; } .row-card .pack-actions { grid-column: 1 / -1; justify-content: flex-start; } .slot { grid-template-columns: 1fr; } .num-row { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="ring" aria-hidden="true"></span>
    <div class="brand">TabigrAm 後台<small>JAM PARTY · ZINE · ADMIN</small></div>
    <span class="sp"></span>
    <div class="who" id="who" hidden><b id="whoName"></b><button class="btn ghost sm" type="button" id="signOutBtn">登出</button></div>
  </header>
  <nav class="tabs" id="tabs" hidden></nav>
  <main id="app"><div class="skeleton"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>

<script>
// ===== 設定（和 App 用同一個 Supabase 專案；這把是公開金鑰，權限由資料庫規則控管）=====
const SUPABASE_URL = "https://pjgjxvahhauqluassiuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_6FOfxpsIuTDrJq0BFCAW6w_uzp-IhVX";
const MAX_SIDE = 512;              // 貼紙縮到最長邊 512 像素
const BUILTIN_NAOBAO = {

// ===== 圖片處理 =====
function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => resolve({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`讀不到 ${file.name}（HEIC 請先轉成 JPG）`)); };
    img.src = url;
  });
}
async function prepImage(file) {
  if (!/^image\//.test(file.type)) throw new Error(`${file.name} 不是圖片`);
  const { img, url } = await fileToImage(file);
  const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (blob.size > 1024 * 1024) throw new Error(`${file.name} 處理後還是超過 1MB`);
  return { blob, preview: URL.createObjectURL(blob), w, h, jpg: /jpe?g/i.test(file.type) };
}
// 依規格處理：裁切或縮放到指定尺寸、轉格式、壓到檔案大小上限
async function processImage(file, spec) {
  if (!/^image\//.test(file.type)) throw new Error(`${file.name} 不是圖片`);
  const { img, url } = await fileToImage(file);
  const iw = img.naturalWidth, ih = img.naturalHeight, warn = [];
  let W = spec.w, H = spec.h;
  if (spec.fit === "max") { const k = Math.min(1, spec.w / iw); W = Math.round(iw * k); H = Math.round(ih * k); }
  else {
    if (iw < spec.w || ih < spec.h) warn.push(`原圖 ${iw}×${ih}，比建議的 ${spec.w}×${spec.h} 小，放大後可能會糊`);
    if (Math.abs(iw / ih - spec.w / spec.h) / (spec.w / spec.h) > 0.03) warn.push(`比例不是 ${spec.w}:${spec.h}，${spec.fit === "cover" ? "多的部分會被裁掉" : "旁邊會留透明"}`);
  }
  if (spec.fmt === "png" && /jpe?g/i.test(file.type)) warn.push("JPG 沒有透明背景，這一層需要透明的話請改用 PNG");
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const s = spec.fit === "cover" ? Math.max(W / iw, H / ih) : spec.fit === "contain" ? Math.min(W / iw, H / ih) : W / iw;
  const dw = iw * s, dh = ih * s;
  g.imageSmoothingQuality = "high";
  g.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  URL.revokeObjectURL(url);
  const type = spec.fmt === "png" ? "image/png" : "image/jpeg";
  let q = 0.88, blob = await new Promise(r => c.toBlob(r, type, q));
  const max = (spec.maxKB || 2000) * 1024;
  while (type === "image/jpeg" && blob.size > max && q > 0.5) { q -= 0.08; blob = await new Promise(r => c.toBlob(r, type, q)); }
  if (blob.size > 8 * 1024 * 1024) throw new Error(`${file.name} 處理後超過 8MB`);
  if (blob.size > max) warn.push(`檔案 ${(blob.size / 1024).toFixed(0)}KB，比建議的 ${spec.maxKB}KB 大，App 會比較慢`);
  return { blob, preview: URL.createObjectURL(blob), warn, ext: spec.fmt === "png" ? "png" : "jpg", type };
}
const nameFromFile = f => f.name.replace(/\.[^.]+$/, "");
function splitName(base) {
  const m = base.split(/[:：]/);
  return m.length >= 2 ? [m[0].trim(), m.slice(1).join(":").trim()] : [base.trim(), ""];
}
function wireDrop(dropId, inputId, handler) {
  const drop = $(dropId), input = $(inputId);
  if (!drop || !input) return;
  input.addEventListener("change", () => { if (input.files.length) handler([...input.files]); input.value = ""; });
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); const fs = [...e.dataTransfer.files].filter(f => /^image\//.test(f.type)); if (fs.length) handler(fs); });
}

function readFields() {

function bindEditor() {
  $("backBtn").addEventListener("click", () => { if (hasUnsaved() && !confirm("還沒儲存，確定要離開嗎？")) return; draft = null; renderList(); });
  ["fName", "fNameEn", "fArtist", "fArtistEn", "fUrl", "fId"].forEach(id => { const el = $(id); if (el) el.addEventListener("input", () => { readFields(); renderPreview(); }); });
  wireDrop("coverDrop", "coverInput", async files => {
    try { readFields(); const r = await prepImage(files[0]); if (draft.cover && draft.cover.path) draft.removed.push(draft.cover.path); draft.cover = { blob: r.blob, preview: r.preview }; renderEditor(); }
    catch (e) { toast(e.message, 4000); }
  });
  wireDrop("stkDrop", "stkInput", async files => {
    readFields();
    let jpg = 0;
    for (const f of files) {
      try { const r = await prepImage(f); if (r.jpg) jpg++; const [zh, en] = splitName(nameFromFile(f)); draft.items.push({ blob: r.blob, preview: r.preview, name: zh, name_en: en }); }
      catch (e) { toast(e.message, 4000); }
    }
    renderEditor();

  });
  document.querySelectorAll(".stk input").forEach(inp => inp.addEventListener("input", () => { draft.items[+inp.dataset.i][inp.dataset.k] = inp.value; draft.touched = true; }));
  const swap = (i, j) => { readFields(); const a = draft.items; [a[i], a[j]] = [a[j], a[i]]; draft.touched = true; renderEditor(); };
  document.querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => swap(+b.dataset.up, +b.dataset.up - 1)));
  document.querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => swap(+b.dataset.down, +b.dataset.down + 1)));
  document.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { readFields(); const [x] = draft.items.splice(+b.dataset.rm, 1); if (x.path) draft.removed.push(x.path); renderEditor(); }));
  bindWorkflow((status, note) => savePack(status, note));
  const db = $("deleteBtn"); if (db) db.addEventListener("click", deletePack);
}
function hasUnsaved() { return draft && (draft.touched || (draft.isNew ? (draft.items.length || draft.name) : (draft.items.some(x => x.blob) || draft.removed.length || (draft.cover && draft.cover.blob)))); }

async function savePack(status, note) {
  readFields();
  const d = draft;
  if (!d.name) return toast("請填中文包名");
  if (!d.items.length) return toast("至少要有一張貼紙");
  if (d.url && !/^https:\/\//.test(d.url)) return toast("作品連結請用 https:// 開頭");
  if (d.items.some(x => !x.name)) return toast("每張貼紙都要有中文名稱");
  if (d.isNew) {
    d.id = slugify(d.id || d.name_en) || ("pack-" + Date.now().toString(36));
    const { data: exist } = await T(sb.from("sticker_packs").select("id").eq("id", d.id).maybeSingle());
    if (exist) return toast(`代號「${d.id}」已經有人用了，換一個`);
  }
  const buttons = document.querySelectorAll(".save-bar .btn"); buttons.forEach(b => b.disabled = true);
  const msg = $("saveMsg");
  try {
    const stamp = Date.now().toString(36);
    const up = async (blob, name) => {
      const path = `${d.id}/${stamp}-${name}.png`;
      const { error } = await T(sb.storage.from("stickers").upload(path, blob, { contentType: "image/png", upsert: false, cacheControl: "31536000" }), 60000);
      if (error) throw new Error("上傳圖片失敗：" + error.message);
      return path;
    };
    const toUpload = d.items.filter(x => x.blob).length + (d.cover && d.cover.blob ? 1 : 0);
    let done = 0;
    const tick = () => { msg.textContent = `上傳中… ${done}/${toUpload}`; };
    tick();
    if (d.cover && d.cover.blob) { d.cover.path = await up(d.cover.blob, "cover"); delete d.cover.blob; done++; tick(); }
    for (let i = 0; i < d.items.length; i++) {
      const x = d.items[i];
      if (x.blob) { x.path = await up(x.blob, String(i + 1).padStart(2, "0")); delete x.blob; done++; tick(); }
    }
    msg.textContent = "儲存中…";
    const next = status || d.status || "draft";
    const row = {
      id: d.id, name: d.name, name_en: d.name_en || d.name, artist: d.artist, artist_en: d.artist_en || d.artist, url: d.url,
      cover: d.cover ? d.cover.path : d.items[0].path,
      items: d.items.map(x => ({ path: x.path, name: x.name, name_en: x.name_en || x.name })),
      published: next === "published", updated_at: new Date().toISOString(),
    };
    if (me.v3) { row.status = next; if (me.admin && next === "rejected") row.review_note = note || ""; if (me.admin && next === "published") row.review_note = ""; }
    if (d.isNew) row.sort = (packs.length + 1) * 10;
    const { error } = d.isNew ? await T(sb.from("sticker_packs").insert(row)) : await T(sb.from("sticker_packs").update(row).eq("id", d.id));
    if (error) throw new Error("儲存失敗：" + error.message);
    if (d.removed.length) await T(sb.storage.from("stickers").remove(d.removed));
    toast({ published: "已上架，App 重新整理後就看得到", review: "已送出審核，管理員發布後就會上架", rejected: "已退回給創作者", draft: "已存成草稿" }[next] || "已儲存");
    draft = null;
    await loadPacks(); renderList(); if (me.admin) refreshBadges();
  } catch (e) {
    toast(e.message, 6000);
    msg.textContent = "沒有儲存成功，可以再試一次。";
    buttons.forEach(b => b.disabled = false);
  }
}
async function deletePack() {
  const d = draft;
  if (!confirm(`確定要刪除「${d.name}」嗎？雲端上的圖片也會一起刪掉，沒辦法復原。`)) return;
  const { error } = await T(sb.from("sticker_packs").delete().eq("id", d.id));
  if (error) return toast("刪除失敗：" + error.message, 5000);
  const paths = [...d.items.map(x => x.path), d.cover && d.cover.path, ...d.removed].filter(Boolean);
  if (paths.length) await T(sb.storage.from("stickers").remove(paths));
  toast("已刪除"); draft = null;
  await loadPacks(); renderList();
}
async function importNaobao() {
  const btn = $("importBtn"); btn.disabled = true; btn.textContent = "搬運中…";
  try {
    const p = BUILTIN_NAOBAO, stamp = Date.now().toString(36);
    const grab = async f => { const r = await fetch(`../stickers/${p.id}/${f}`); if (!r.ok) throw new Error(`找不到 ${f}`); return r.blob(); };
    const put = async (blob, name) => { const path = `${p.id}/${stamp}-${name}.png`; const { error } = await T(sb.storage.from("stickers").upload(path, blob, { contentType: "image/png", cacheControl: "31536000" }), 60000); if (error) throw new Error(error.message); return path; };
    const cover = await put(await grab(p.cover), "cover");
    const items = [];
    for (let i = 0; i < p.items.length; i++) { const [f, zh, en] = p.items[i]; items.push({ path: await put(await grab(f), String(i + 1).padStart(2, "0")), name: zh, name_en: en }); btn.textContent = `搬運中… ${i + 1}/${p.items.length}`; }
    const row = { id: p.id, name: p.name, name_en: p.name_en, artist: p.artist, artist_en: p.artist_en, url: p.url, cover, items, sort: 10, published: true };
    if (me.v3) row.status = "published";
    const { error } = await T(sb.from("sticker_packs").insert(row));
    if (error) throw new Error(error.message);
    toast("搬好了，已經上架");
    await loadPacks(); renderList();
  } catch (e) {
    toast("搬運失敗：" + e.message, 6000); btn.disabled = false; btn.textContent = "一鍵搬進來";
  }
}

function readGFields() {

  set("title", "gTitle"); set("subtitle", "gSubtitle"); set("author_name", "gAuthor"); set("author_url", "gAuthorUrl"); set("issue", "gIssue");
  set("name", "gName"); set("name_en", "gNameEn"); set("artist", "gArtist"); set("artist_en", "gArtistEn"); set("url", "gUrl");
  if ($("gTags")) d.tags = $("gTags").value.split(/[,，、]/).map(s => s.trim()).filter(Boolean).slice(0, 8);
  if (d.isNew) set("id", "gId");
  if ($("cText")) d.colors = { text: $("cText").value, sub: $("cSub").value, accent: $("cAccent").value };
  document.querySelectorAll("[data-win]").forEach(inp => { d.photo_window[inp.dataset.win] = Math.max(0, Math.min(1, parseFloat(inp.value) || 0)); });
  if ($("cCap")) d.caption_color = $("cCap").value;
  document.querySelectorAll("[data-bk]").forEach(inp => { const b = d.blocks[+inp.dataset.bi]; if (b) b[inp.dataset.bk] = inp.value; });
}
function bindGEditor() {

  ct.slots.forEach(slot => wireDrop(`drop_${slot.key}`, `inp_${slot.key}`, async files => {
    try { readGFields(); d.files[slot.key] = await processImage(files[0], slot); d.dirty = true; renderGEditor(); }
    catch (e) { toast(e.message, 5000); }
  }));

async function saveG(status, note) {
  readGFields();
  const d = gdraft, ct = CT[d.kind];
  const label = d.kind === "zine" ? d.title : d.name;
  if (!label) return toast(d.kind === "zine" ? "請填標題" : "請填中文名稱");
  if ((d.url && !/^https:\/\//.test(d.url)) || (d.author_url && !/^https:\/\//.test(d.author_url))) return toast("連結請用 https:// 開頭");
  const next = status || d.status || "draft";
  if (next !== "draft") {
    const miss = ct.slots.filter(s => !(d.files[s.key] || d[s.key]) && !(d.kind === "themes" && s.key === "overlay"));
    if (miss.length) return toast(`還缺：${miss.map(s => s.label).join("、")}`);
  }
  if (d.isNew) {
    d.id = slugify(d.id || d.name_en || d.title) || (d.kind + "-" + Date.now().toString(36));
    const { data: exist } = await T(sb.from(ct.table).select("id").eq("id", d.id).maybeSingle());
    if (exist) return toast(`代號「${d.id}」已經用過了，換一個`);
  }
  const buttons = document.querySelectorAll(".save-bar .btn"); buttons.forEach(b => b.disabled = true);
  const msg = $("gMsg");
  try {
    const stamp = Date.now().toString(36);
    const up = async (f, name) => {
      const path = `${ct.folder}/${d.id}/${stamp}-${name}.${f.ext}`;
      const { error } = await T(sb.storage.from("content").upload(path, f.blob, { contentType: f.type, upsert: false, cacheControl: "31536000" }), 60000);
      if (error) throw new Error("上傳圖片失敗：" + error.message);
      return path;
    };
    msg.textContent = "上傳圖片中…";
    for (const slot of ct.slots) if (d.files[slot.key]) { d[slot.key] = await up(d.files[slot.key], slot.key); delete d.files[slot.key]; }
    if (d.kind === "zine") {
      for (let i = 0; i < d.blocks.length; i++) { const b = d.blocks[i]; if (b._file) { b.src = await up(b._file, "img" + (i + 1)); delete b._file; delete b._preview; } }
    }
    msg.textContent = "儲存中…";
    const base = { id: d.id, status: next };
    if (me.admin && next === "rejected") base.review_note = note || "";
    if (me.admin && next === "published") base.review_note = "";
    let row;
    if (d.kind === "themes") row = { ...base, name: d.name, name_en: d.name_en || d.name, artist: d.artist, artist_en: d.artist_en || d.artist, url: d.url, background: d.background || "", paper: d.paper || "", overlay: d.overlay || "", colors: d.colors };
    else if (d.kind === "polaroid") row = { ...base, name: d.name, name_en: d.name_en || d.name, artist: d.artist, artist_en: d.artist_en || d.artist, url: d.url, frame: d.frame || "", photo_window: d.photo_window, caption_color: d.caption_color };
    else row = { ...base, title: d.title, subtitle: d.subtitle, issue: d.issue, author_name: d.author_name, author_url: d.author_url, tags: d.tags, cover: d.cover || "",
      blocks: d.blocks.map(b => { const o = { ...b }; delete o._file; delete o._preview; delete o._warn; return o; }), read_minutes: Math.max(1, Math.ceil(zineChars(d) / 450)) };
    if (d.isNew) row.sort = 100;
    const { error } = d.isNew ? await T(sb.from(ct.table).insert(row)) : await T(sb.from(ct.table).update(row).eq("id", d.id));
    if (error) throw new Error("儲存失敗：" + error.message);
    toast({ published: "已上架", review: "已送出審核", rejected: "已退回給創作者", draft: "已存成草稿" }[next] || "已儲存");
    const kind = d.kind; gdraft = null;
    await renderContentList(kind); if (me.admin) refreshBadges();
  } catch (e) {
    toast(e.message, 6000); msg.textContent = "沒有儲存成功，可以再試一次。"; buttons.forEach(b => b.disabled = false);
  }
}
async function deleteG() {
  const d = gdraft, ct = CT[d.kind];

    <div class="blk-add">${Object.entries(BLK).map(([k, v]) => `<button class="btn soft sm" type="button" data-badd="${k}">＋ ${v}</button>`).join("")}</div></section>`;
}
function bindZineBlocks() {
  const d = gdraft;
  const rerender = () => { readGFields(); d.dirty = true; renderGEditor(); };
  document.querySelectorAll("[data-badd]").forEach(b => b.addEventListener("click", () => { readGFields(); d.blocks.push({ type: b.dataset.badd }); d.dirty = true; renderGEditor(); }));
  document.querySelectorAll("[data-brm]").forEach(b => b.addEventListener("click", () => { readGFields(); d.blocks.splice(+b.dataset.brm, 1); rerender(); }));
  const mv = (i, j) => { readGFields(); [d.blocks[i], d.blocks[j]] = [d.blocks[j], d.blocks[i]]; rerender(); };
  document.querySelectorAll("[data-bup]").forEach(b => b.addEventListener("click", () => mv(+b.dataset.bup, +b.dataset.bup - 1)));
  document.querySelectorAll("[data-bdown]").forEach(b => b.addEventListener("click", () => mv(+b.dataset.bdown, +b.dataset.bdown + 1)));
  document.querySelectorAll("[data-bimg]").forEach(inp => inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;
    try { readGFields(); const r = await processImage(f, { w: 1600, h: 1600, fit: "max", fmt: "jpeg", maxKB: 500 }); const b = d.blocks[+inp.dataset.bimg]; b._file = r; b._preview = r.preview; b._warn = r.warn; d.dirty = true; renderGEditor(); }
    catch (e) { toast(e.message, 5000); }
  }));
}

};
async function renderDash() {
  if (!me.v3) { $("app").innerHTML = v3Message("數據"); return; }
  const from = new Date(Date.now() + 8 * 3600e3 - (dashDays - 1) * 86400e3).toISOString().slice(0, 10);
  const { data, error } = await T(sb.from("metrics_daily").select("day,event,dim,count").gte("day", from).limit(20000));
  if (error) { $("app").innerHTML = needV3(error) ? v3Message("數據") : `<section class="card center"><p>${esc(error.message)}</p></section>`; return; }
  const rows = data || [];
  const sum = (ev, dim) => rows.filter(r => r.event === ev && (dim == null || r.dim === dim)).reduce((a, r) => a + Number(r.count), 0);
  const byDim = ev => { const m = {}; rows.filter(r => r.event === ev).forEach(r => { m[r.dim || "—"] = (m[r.dim || "—"] || 0) + Number(r.count); }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const days = []; for (let i = dashDays - 1; i >= 0; i--) days.push(new Date(Date.now() + 8 * 3600e3 - i * 86400e3).toISOString().slice(0, 10));
  const dau = days.map(d => rows.filter(r => r.day === d && r.event === "dev_day").reduce((a, r) => a + Number(r.count), 0));
  const today = dau[dau.length - 1], avg = Math.round(dau.reduce((a, b) => a + b, 0) / dau.length);
  const newDev = sum("ret", "new"), signup = sum("signup"), firstItem = sum("first_item"), shares = sum("share_save");
  const conv = newDev ? (signup / newDev * 100) : 0;
  const maxDau = Math.max(1, ...dau);
  const hbars = (list, total, map) => list.length ? `<div class="hbars">${list.slice(0, 10).map(([n, v]) => `<div class="hbar" data-tip="${esc((map && map[n]) || n)}：${v.toLocaleString()}${total ? `（${(v / total * 100).toFixed(1)}%）` : ""}"><span class="n">${esc((map && map[n]) || n)}</span><span class="t"><i style="width:${(v / list[0][1] * 100).toFixed(1)}%"></i></span><span class="v">${v.toLocaleString()}</span></div>`).join("")}</div>` : `<div class="empty-note">這段期間還沒有資料</div>`;
  const funnel = [["新裝置", newDev], ["開始排行程", firstItem], ["分享過卡片", shares], ["註冊", signup]];
  const retList = byDim("ret");
  const RET = { new: "新的", d1: "隔天回來", d2_7: "2～7 天內回來", d8_30: "8～30 天內回來", d31: "超過 30 天回來" };
  const retTotal = retList.reduce((a, [, v]) => a + v, 0);
  $("app").innerHTML = `<h1>數據</h1>
    <p class="lead">匿名統計：只有「每天、每種事件幾次」，沒有帳號、裝置代號、IP、位置。事件說明見專案裡的 ANALYTICS.md。</p>
    <div class="fb-tools">${[7, 30, 90].map(n => `<button type="button" class="chip ${dashDays === n ? "on" : ""}" data-days="${n}">最近 ${n} 天</button>`).join("")}<span class="sp" style="flex:1;"></span><button type="button" class="chip" id="dCsv">匯出 CSV</button></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${today.toLocaleString()}</div><div class="l">今天使用的裝置</div><div class="s">${dashDays} 天平均 ${avg.toLocaleString()}</div></div>
      <div class="kpi"><div class="v">${newDev.toLocaleString()}</div><div class="l">新裝置</div><div class="s">最近 ${dashDays} 天</div></div>
      <div class="kpi"><div class="v">${signup.toLocaleString()}</div><div class="l">註冊</div><div class="s">轉換率 ${conv.toFixed(1)}%（註冊 ÷ 新裝置）</div></div>
      <div class="kpi"><div class="v">${shares.toLocaleString()}</div><div class="l">儲存／分享的卡片</div><div class="s">開啟 ${sum("open").toLocaleString()} 次</div></div>
    </div>
    <div class="dash-grid">
      <section class="card chart-card" style="grid-column:1 / -1;"><h2>每天使用的裝置</h2>
        <div class="cols">${dau.map((v, i) => `<span class="c" style="height:${(v / maxDau * 100).toFixed(1)}%" data-tip="${days[i].slice(5).replace("-", "/")}：${v} 台"></span>`).join("")}</div>
        <div class="cols-x"><span>${days[0].slice(5).replace("-", "/")}</span><span>${days[days.length - 1].slice(5).replace("-", "/")}</span></div></section>
      <section class="card chart-card"><h2>漏斗（最近 ${dashDays} 天）</h2>${hbars(funnel.filter(x => true), newDev)}</section>
      <section class="card chart-card"><h2>回訪</h2>${hbars(retList, retTotal, RET)}</section>
      ${["dev_day", "share_save", "sticker_use", "rail_pick", "item_add", "map_open", "lang"].map(ev => `<section class="card chart-card"><h2>${EV_LABEL[ev]}</h2>${hbars(byDim(ev), byDim(ev).reduce((a, [, v]) => a + v, 0))}</section>`).join("")}
      <section class="card chart-card"><h2>穩定度</h2>${hbars([["同步失敗", sum("sync_fail")], ["程式出錯", sum("js_error")], ["離線打開", sum("offline_open")], ["查班次失敗", sum("timetable", "err")]].filter(x => x[1] > 0))}</section>
      <section class="card chart-card"><h2>所有事件</h2>${hbars(Object.entries(rows.reduce((m, r) => (m[r.event] = (m[r.event] || 0) + Number(r.count), m), {})).sort((a, b) => b[1] - a[1]))}</section>
    </div>`;
  document.querySelectorAll("[data-days]").forEach(b => b.addEventListener("click", () => { dashDays = +b.dataset.days; renderDash(); }));
  $("dCsv").addEventListener("click", () => {
    const csv = "day,event,dim,count\n" + rows.map(r => [r.day, r.event, r.dim, r.count].join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = `tabigram-metrics-${days[0]}-${days[days.length - 1]}.csv`; a.click();
  });
  bindTips();
}
function bindTips() {
  const tip = $("tip");
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => { tip.textContent = el.dataset.tip; tip.style.display = "block"; tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; });
    el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  });
}

// =====================================================================
// 意見回饋看板
// =====================================================================
const FB_CAT = { bug: "問題回報", idea: "建議", love: "喜歡", other: "其他" };
let feedback = [], fbFilter = { cat: "all", open: true, q: "" }, fbError = "";
async function loadFeedback() {
  if (!me.admin) return;
  const { data, error } = await T(sb.from("feedback").select("*").order("created_at", { ascending: false }).limit(500));
  fbError = error ? error.message : "";
  feedback = data || [];
}
function updateFbCount() {
  const el = $("fbCount"); if (!el) return;
  const n = feedback.filter(f => !f.handled).length;
  el.textContent = n ? String(n) : "";
}
function renderFeedback() {
  updateFbCount();
  if (fbError) {
    $("app").innerHTML = `<section class="card center"><h1>還讀不到回饋</h1><p>請先在 Supabase 的 SQL Editor 執行 SUPABASE_ADMIN_V2.sql（讓管理員可以讀取回饋）。</p><p style="font-size:12px;">${esc(fbError)}</p></section>`;
    return;
  }
  const q = fbFilter.q.trim().toLowerCase();
  const list = feedback.filter(f => (fbFilter.cat === "all" || f.category === fbFilter.cat) && (!fbFilter.open || !f.handled)
    && (!q || `${f.message} ${f.email || ""} ${f.page_info || ""}`.toLowerCase().includes(q)));
  const count = c => feedback.filter(f => (c === "all" || f.category === c) && (!fbFilter.open || !f.handled)).length;
  const chip = (k, label) => `<button type="button" class="chip ${fbFilter.cat === k ? "on" : ""}" data-cat="${k}">${label} ${count(k)}</button>`;
  const fmt = t => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  $("app").innerHTML = `
    <h1>意見回饋</h1>
    <p class="lead">使用者在 App「意見回饋」和「選車站 → 告訴我們」送出的內容。處理完按「已處理」，就會從待處理清單收起來。</p>
    <div class="fb-tools">
      ${chip("all", "全部")}${chip("bug", "問題回報")}${chip("idea", "建議")}${chip("love", "喜歡")}${chip("other", "其他")}
      <button type="button" class="chip ${fbFilter.open ? "on" : ""}" id="fbOpen">只看待處理</button>
      <input class="fb-search" id="fbSearch" type="search" placeholder="搜尋內容、Email（例如「車站資料」）" value="${esc(fbFilter.q)}">
    </div>
    <div class="list">${list.map(f => `<article class="card fb ${f.handled ? "done" : ""}">
        <div class="fb-head"><span class="fb-cat ${esc(f.category)}">${esc(FB_CAT[f.category] || f.category)}</span><span>${esc(fmt(f.created_at))}</span>${f.email ? `<a href="mailto:${esc(f.email)}">${esc(f.email)}</a>` : `<span>沒有留 Email</span>`}</div>
        <div class="fb-msg">${esc(f.message)}</div>
        ${f.page_info ? `<div class="fb-info">${esc(f.page_info)}</div>` : ""}
        <div class="fb-foot"><span class="sp"></span>
          ${f.email ? `<a class="btn soft sm" href="mailto:${esc(f.email)}?subject=${encodeURIComponent("TabigrAm 回覆你的意見")}">回信</a>` : ""}
          <button class="btn ${f.handled ? "ghost" : "dark"} sm" type="button" data-handled="${f.id}">${f.handled ? "改回待處理" : "已處理"}</button>
        </div>
      </article>`).join("") || `<section class="card center"><div class="kicker">ALL CLEAR</div><h2 style="margin-top:6px;">沒有符合的回饋</h2></section>`}</div>`;
  document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => { fbFilter.cat = b.dataset.cat; renderFeedback(); }));
  $("fbOpen").addEventListener("click", () => { fbFilter.open = !fbFilter.open; renderFeedback(); });
  const si = $("fbSearch");
  si.addEventListener("input", () => { fbFilter.q = si.value; clearTimeout(si._t); si._t = setTimeout(() => { renderFeedback(); const n = $("fbSearch"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); });
  document.querySelectorAll("[data-handled]").forEach(b => b.addEventListener("click", () => toggleHandled(Number(b.dataset.handled), b)));
}
async function toggleHandled(id, btn) {
  const f = feedback.find(x => x.id === id); if (!f) return;
  btn.disabled = true;
  const { error } = await T(sb.from("feedback").update({ handled: !f.handled }).eq("id", id));
  btn.disabled = false;
  if (error) return toast("更新失敗：" + error.message, 5000);
  f.handled = !f.handled;
  renderFeedback(); updateFbCount();
}

boot().catch(e => { booted = false; renderMessage("出了點問題", String(e && e.message || e)); });
</script>
