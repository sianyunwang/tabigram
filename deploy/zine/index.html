<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TabigrAm.zine</title>
<meta name="description" content="TabigrAm.zine：一分鐘讀完的旅行小誌。">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* TabigrAm.zine：紙張質感的旅行小誌（測試版，還沒和 App 串在一起） */
:root {
  --paper: #EFEBE2; --ink: #1F1D1A; --sub: #6B655B; --line: rgba(31,29,26,.16);
  --accent: #FF4F00; --accent2: #2F6FDB; --tape: rgba(240, 214, 140, .78);
  --serif: 'Noto Serif TC', serif; --sans: 'Noto Sans TC', -apple-system, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  --paper-img: none; --paper-size: 512px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: var(--paper-img);
  background-size: var(--paper-size) var(--paper-size);
  color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.75;
  min-height: 100vh; overflow-x: hidden;
}
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top, 0px)) 18px 80px; }

/* ===== 刊頭：孔版印刷的套色偏移，慢慢對準 ===== */
.mast { text-align: center; padding: 18px 0 8px; position: relative; }
.mast .kicker { font: 800 11px var(--mono); letter-spacing: .3em; color: var(--sub); }
.riso { position: relative; display: inline-block; font-family: var(--serif); font-weight: 900; font-size: clamp(44px, 11vw, 112px); line-height: 1; letter-spacing: -.02em; margin: 10px 0 6px; }
.riso span { display: block; }
.riso .l1 { color: var(--accent); mix-blend-mode: multiply; }
.riso .l2 { position: absolute; inset: 0; color: var(--accent2); mix-blend-mode: multiply; animation: register 2.4s cubic-bezier(.2,.8,.2,1) .2s both; }
.riso .l3 { position: absolute; inset: 0; color: var(--ink); opacity: .9; animation: inkin 1.2s ease 1.6s both; }
@keyframes register { from { transform: translate(7px, -5px) rotate(-.6deg); } to { transform: translate(1.5px, 1px); } }
@keyframes inkin { from { opacity: 0; } to { opacity: .9; } }
.mast .tag { font-family: var(--serif); font-size: 15px; color: var(--sub); margin-top: 14px; }
.mast .rule { display: flex; align-items: center; gap: 10px; margin: 18px auto 0; max-width: 560px; font: 700 11px var(--mono); color: var(--sub); letter-spacing: .12em; }
.mast .rule::before, .mast .rule::after { content: ""; flex: 1; border-top: 1.5px dashed var(--line); }

/* ===== 目錄：剪下來貼上去的卡片 ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 34px 26px; margin-top: 34px; }
.cut { position: relative; display: block; text-decoration: none; background: #FBF9F4; padding: 12px 12px 16px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 24px -12px rgba(40,30,10,.35);
  transform: rotate(var(--rot, -1deg)); transition: transform .35s cubic-bezier(.3,1.4,.5,1), box-shadow .3s; cursor: pointer; border: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.cut:hover, .cut:focus-visible { transform: rotate(0deg) translateY(-4px); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 34px -14px rgba(40,30,10,.45); outline: none; }
.cut::before, .cut::after { content: ""; position: absolute; width: 78px; height: 24px; background: var(--tape); top: -11px; box-shadow: 0 1px 2px rgba(0,0,0,.08); opacity: .95;
  -webkit-mask: linear-gradient(90deg, transparent 0 3px, #000 3px calc(100% - 3px), transparent 0), repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 3px); mask: linear-gradient(90deg, transparent 0 3px, #000 3px calc(100% - 3px), transparent 0); }
.cut::before { left: 18px; transform: rotate(-6deg); }
.cut::after { right: 18px; transform: rotate(5deg); }
.cut .img { aspect-ratio: 16 / 10; background: #D9D3C7 center / cover no-repeat; filter: saturate(.92) contrast(1.02); }
.cut .meta { font: 700 11px var(--mono); color: var(--accent); letter-spacing: .08em; margin-top: 12px; }
.cut h2 { font-family: var(--serif); font-size: 22px; line-height: 1.35; margin: 4px 0 4px; }
.cut p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.6; }
.cut .by { margin-top: 10px; font-size: 12.5px; color: var(--sub); display: flex; justify-content: space-between; gap: 8px; }
.cut .feat { position: absolute; right: 18px; top: 22px; z-index: 1; background: var(--accent); color: #fff; font: 800 11px var(--mono); padding: 4px 9px; transform: rotate(4deg); letter-spacing: .08em; }
/* 捲到才「貼上去」 */
.cut.pre { opacity: 0; transform: translateY(-26px) rotate(calc(var(--rot, -1deg) * 4)) scale(1.04); }
.cut.land { animation: land .7s cubic-bezier(.25,1.5,.45,1) both; }
@keyframes land { from { opacity: 0; transform: translateY(-26px) rotate(calc(var(--rot, -1deg) * 4)) scale(1.04); } 60% { opacity: 1; } to { opacity: 1; transform: rotate(var(--rot, -1deg)); } }

/* ===== 文章頁：翻頁 ===== */
.stage { perspective: 2200px; }
.sheet { background: #FBF9F4; max-width: 720px; margin: 24px auto 0; padding: clamp(22px, 5vw, 56px) clamp(18px, 6vw, 64px) 56px; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 30px 60px -30px rgba(40,30,10,.45); position: relative; transform-origin: left center; }
.sheet.turn-in { animation: turnin .75s cubic-bezier(.2,.8,.2,1) both; }
.sheet.turn-out { animation: turnout .45s cubic-bezier(.6,0,.8,.4) both; }
@keyframes turnin { from { transform: rotateY(-78deg) translateX(-4%); opacity: .3; box-shadow: 40px 30px 60px -20px rgba(40,30,10,.35); } to { transform: none; opacity: 1; } }
@keyframes turnout { to { transform: rotateY(-70deg); opacity: 0; } }
.sheet .back { border: 0; background: none; font: 700 13px var(--mono); color: var(--sub); cursor: pointer; padding: 0; letter-spacing: .06em; }
.sheet .issue { font: 800 11px var(--mono); color: var(--accent); letter-spacing: .14em; margin-top: 22px; }
.sheet h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(28px, 6vw, 44px); line-height: 1.25; margin: 8px 0 10px; text-wrap: balance; }
.sheet .lede { font-family: var(--serif); font-size: 18px; color: var(--sub); margin: 0 0 16px; text-wrap: pretty; }
.sheet .byline { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--sub); border-top: 1.5px dashed var(--line); border-bottom: 1.5px dashed var(--line); padding: 8px 0; margin-bottom: 26px; }
.sheet .cover { aspect-ratio: 16 / 10; background: #D9D3C7 center / cover no-repeat; margin: 0 calc(clamp(18px, 6vw, 64px) * -.4) 28px; }
.sheet .body p { margin: 0 0 1.1em; text-wrap: pretty; }
.sheet figure { margin: 30px 0; position: relative; }
.sheet figure img { width: 100%; display: block; transform: rotate(var(--rot, .8deg)); box-shadow: 0 10px 24px -14px rgba(40,30,10,.5); background: #fff; padding: 8px 8px 8px; }
.sheet figure::before { content: ""; position: absolute; z-index: 1; left: 50%; top: -10px; width: 90px; height: 22px; margin-left: -45px; background: var(--tape); transform: rotate(-3deg); }
.sheet figcaption { font-size: 13px; color: var(--sub); margin-top: 12px; text-align: center; font-family: var(--serif); }
.sheet blockquote { margin: 30px 0; padding: 0 0 0 18px; border-left: 4px solid var(--accent); font-family: var(--serif); font-size: 21px; line-height: 1.6; }
.sheet blockquote cite { display: block; font-style: normal; font-size: 13px; color: var(--sub); margin-top: 8px; font-family: var(--sans); }
.ticket { margin: 28px 0; background: #FFF8E6; border: 1.5px dashed rgba(31,29,26,.3); border-radius: 6px; padding: 14px 16px 14px 56px; position: relative; }
.ticket::before { content: "TIP"; position: absolute; left: 12px; top: 14px; font: 800 11px var(--mono); color: var(--accent); writing-mode: vertical-rl; letter-spacing: .2em; }
.ticket b { display: block; font-family: var(--serif); font-size: 17px; }
.ticket p { margin: 4px 0 0 !important; color: var(--sub); font-size: 14.5px; }
.place { margin: 28px 0; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; background: #fff; padding: 14px 16px; box-shadow: 0 8px 18px -12px rgba(40,30,10,.4); transform: rotate(-.4deg); }
.place .pin { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 900 18px var(--sans); }
.place b { font-family: var(--serif); font-size: 18px; }
.place p { margin: 2px 0 0 !important; color: var(--sub); font-size: 14.5px; }
.place a { font: 700 12.5px var(--mono); color: var(--accent2); }
.sheet .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 30px; }
.sheet .tags span { font: 700 12px var(--mono); background: #EDE8DD; padding: 3px 9px; border-radius: 999px; color: var(--sub); }
.sheet .end { text-align: center; margin-top: 40px; font: 700 12px var(--mono); color: var(--sub); letter-spacing: .3em; }
.preview-flag { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; font: 700 12px var(--mono); padding: 6px 12px; border-radius: 999px; }
.foot { text-align: center; margin-top: 60px; font-size: 12.5px; color: var(--sub); }
.foot a { color: var(--ink); }
.empty { text-align: center; color: var(--sub); padding: 60px 0; font-family: var(--serif); }
@media (prefers-reduced-motion: reduce) {
  .riso .l2, .riso .l3, .cut.land, .sheet.turn-in, .sheet.turn-out { animation: none !important; }
  .riso .l2 { transform: translate(1.5px, 1px); } .riso .l3 { opacity: .9; }
  .cut.pre { opacity: 1; transform: rotate(var(--rot, -1deg)); }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
// ===== 設定：和 TabigrAm 同一個 Supabase（公開金鑰，權限由資料庫規則控管）=====
const SUPABASE_URL = "https://pjgjxvahhauqluassiuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_6FOfxpsIuTDrJq0BFCAW6w_uzp-IhVX";
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const img = p => !p ? "" : /^(https?:|\.\.\/|data:)/.test(p) ? p : `${SUPABASE_URL}/storage/v1/object/public/content/${String(p).split("/").map(encodeURIComponent).join("/")}`;
const params = new URLSearchParams(location.search);
// 減少動態，或頁面在背景（瀏覽器會暫停動畫，畫面會停在第一格）時，不做動畫
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches || document.hidden;

// ===== 範例紙張（還沒在後台上傳紙張時用）：用雜訊畫出來、可以無縫拼接 =====
const SAMPLE_PAPER = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512'>
<filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .44  0 0 0 0 .40  0 0 0 0 .33  0 0 0 .09 0'/></filter>
<filter id='g'><feTurbulence type='fractalNoise' baseFrequency='.012 .04' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .42  0 0 0 .07 0'/></filter>
<rect width='512' height='512' fill='#EFEBE2'/><rect width='512' height='512' filter='url(#g)'/><rect width='512' height='512' filter='url(#f)'/></svg>`);

// ===== 範例文章（還沒有發布的文章時顯示，讓版面先看得到）=====
const SAMPLE = [
  { id: "sample-kyoto", issue: "No.00 範例", title: "京都秋天，只走一條街", subtitle: "從出町柳走到下鴨神社的半日提案：一間咖啡店、一座神社、一條河。", author_name: "TabigrAm 編輯部", read_minutes: 1, featured: true, cover: "../sample-memory-card.jpg", tags: ["京都", "散步", "秋天"],
    blocks: [
      { type: "text", text: "早上九點的出町柳，鴨川兩條支流在這裡會合。先別急著拍照，沿著河堤往北走五分鐘，**風會比市區涼一點**。\n\n如果只有半天，不要排太多。一條街、一杯咖啡、一座森林裡的神社，就夠了。" },
      { type: "image", src: "../sample-route-card.jpg", caption: "叡山電鉄從出町柳出發，兩節車廂的小電車。" },
      { type: "tip", title: "旅行小物｜折疊水壺", text: "河邊沒有什麼販賣機，帶一個摺起來只有手掌大的水壺，裝滿再出門。" },
      { type: "quote", text: "慢慢走，才會看到糺之森的光是一條一條落下來的。", by: "寫在下鴨神社前" },
      { type: "place", title: "下鴨神社・糺之森", text: "世界遺產裡的原生林，參道兩旁的樹比你想像的還要高。", link: "https://maps.google.com/?q=下鴨神社" },
      { type: "text", text: "回程可以搭叡山電鉄到一乘寺，再找一間書店躲雨。" },
    ] },
  { id: "sample-tokyo", issue: "No.00 範例", title: "東京，用一張地鐵票", subtitle: "從中目黑到淺草，銀座線轉日比谷線，一天的城市切片。", author_name: "TabigrAm 編輯部", read_minutes: 1, cover: "../sample-route-card.jpg", tags: ["東京", "地鐵"],
    blocks: [{ type: "text", text: "這是一篇範例文章。在後台「Zine」新增文章、送審、發布之後，這裡就會換成真的內容。" }] },
  { id: "sample-flight", issue: "No.00 範例", title: "出發前一晚的行李清單", subtitle: "一張紙寫得下的東西，才是真的需要的東西。", author_name: "TabigrAm 編輯部", read_minutes: 1, cover: "../sample-flight-card.jpg", tags: ["行李", "清單"],
    blocks: [{ type: "text", text: "這是一篇範例文章。" }] },
];

let CONFIG = { name: "TabigrAm.zine", paper: "", paper_scale: 512, accent: "#FF4F00" };
let ARTICLES = [];
let usingSample = false;

// 匿名統計（和 App 同一套：只有次數）
function track(e, d) {
  try {
    if (navigator.doNotTrack === "1" || navigator.globalPrivacyControl === true) return;
    fetch(`${SUPABASE_URL}/rest/v1/rpc/track`, { method: "POST", keepalive: true, headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify({ events: [d ? { e, d: String(d).slice(0, 40) } : { e }] }) }).catch(() => {});
  } catch (e) {}
}

async function getJSON(url) {
  const r = await Promise.race([fetch(url, { headers: H }), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))]);
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function loadConfig() {
  try { const rows = await getJSON(`${SUPABASE_URL}/rest/v1/app_config?select=value&key=eq.zine`); if (rows[0] && rows[0].value) CONFIG = { ...CONFIG, ...rows[0].value }; } catch (e) {}
  document.documentElement.style.setProperty("--paper-img", `url("${CONFIG.paper ? img(CONFIG.paper) : SAMPLE_PAPER}")`);
  document.documentElement.style.setProperty("--paper-size", `${Number(CONFIG.paper_scale) || 512}px`);
  if (CONFIG.accent) document.documentElement.style.setProperty("--accent", CONFIG.accent);
}
async function loadArticles() {
  try {
    ARTICLES = await getJSON(`${SUPABASE_URL}/rest/v1/zine_articles?select=id,title,subtitle,issue,author_name,author_url,cover,blocks,tags,read_minutes,featured,published_at&status=eq.published&order=featured.desc,sort.asc,published_at.desc`);
  } catch (e) { ARTICLES = []; }
  if (!ARTICLES.length) { ARTICLES = SAMPLE; usingSample = true; }
}
// 作者、管理員預覽草稿：用登入狀態讀（和 TabigrAm 同一個網站，登入會共用）
async function loadPreview(id) {
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.from("zine_articles").select("*").eq("id", id).maybeSingle();
  return data;
}

// ===== 文字：段落之間空一行；**粗體** =====
function rich(t) {
  return String(t || "").split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>")}</p>`).join("");
}
function blockHtml(b, i) {
  const rot = ((i * 37) % 5 - 2) * .35;
  if (b.type === "text") return rich(b.text);
  if (b.type === "image" && b.src) return `<figure style="--rot:${rot}deg"><img src="${esc(img(b.src))}" alt="${esc(b.caption || "")}" loading="lazy">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ""}</figure>`;
  if (b.type === "quote") return `<blockquote>${esc(b.text)}${b.by ? `<cite>— ${esc(b.by)}</cite>` : ""}</blockquote>`;
  if (b.type === "tip") return `<div class="ticket"><b>${esc(b.title || "")}</b><p>${esc(b.text || "")}</p></div>`;
  if (b.type === "place") return `<div class="place"><span class="pin">●</span><div><b>${esc(b.title || "")}</b><p>${esc(b.text || "")}</p>${/^https:\/\//.test(b.link || "") ? `<a href="${esc(b.link)}" target="_blank" rel="noopener">打開地圖 ↗</a>` : ""}</div></div>`;
  return "";
}

// ===== 目錄 =====
function renderList() {
  document.title = CONFIG.name || "TabigrAm.zine";
  const name = CONFIG.name || "TabigrAm.zine";
  $app.innerHTML = `
    <header class="mast">
      <div class="kicker">A TINY TRAVEL ZINE</div>
      <div class="riso" aria-label="${esc(name)}"><span class="l1">${esc(name)}</span><span class="l2" aria-hidden="true">${esc(name)}</span><span class="l3" aria-hidden="true">${esc(name)}</span></div>
      <div class="tag">一分鐘讀完的旅行小誌：一個提案、一件好物、一個好地方。</div>
      <div class="rule">${usingSample ? "範例內容 · SAMPLE" : `${ARTICLES.length} STORIES`}</div>
    </header>
    <section class="grid">${ARTICLES.map((a, i) => `<button type="button" class="cut ${reduced ? "" : "pre"}" style="--rot:${(((i * 53) % 7) - 3) * .5}deg" data-id="${esc(a.id)}">
        ${a.featured ? `<span class="feat">PICK</span>` : ""}
        <div class="img" style="background-image:url('${esc(img(a.cover))}')"></div>
        <div class="meta">${esc(a.issue || "TabigrAm.zine")}</div>
        <h2>${esc(a.title)}</h2>
        <p>${esc(a.subtitle || "")}</p>
        <div class="by"><span>文・${esc(a.author_name || "")}</span><span>${Number(a.read_minutes) || 1} min</span></div>
      </button>`).join("") || `<div class="empty">還沒有文章</div>`}</section>
    <div class="foot">由 <a href="../">TabigrAm</a> 出版 · 測試版</div>`;
  document.querySelectorAll(".cut").forEach(c => c.addEventListener("click", () => openArticle(c.dataset.id, c)));
  // 捲到才一張一張「貼上去」
  if (!reduced && "IntersectionObserver" in window) {
    let n = 0;
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const el = e.target;
      setTimeout(() => { el.classList.remove("pre"); el.classList.add("land"); }, (n++ % 6) * 110);
    }), { threshold: .15 });
    document.querySelectorAll(".cut.pre").forEach(c => io.observe(c));
  } else document.querySelectorAll(".cut.pre").forEach(c => c.classList.remove("pre"));
}

// ===== 文章 =====
function articleHtml(a, preview) {
  return `<div class="stage"><article class="sheet ${reduced ? "" : "turn-in"}">
    <button type="button" class="back" id="backBtn">← ${esc(CONFIG.name || "TabigrAm.zine")}</button>
    <div class="issue">${esc(a.issue || "TabigrAm.zine")}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle ? `<p class="lede">${esc(a.subtitle)}</p>` : ""}
    <div class="byline"><span>文・${a.author_url ? `<a href="${esc(a.author_url)}" target="_blank" rel="noopener">${esc(a.author_name)}</a>` : esc(a.author_name || "")}</span><span>${Number(a.read_minutes) || 1} 分鐘讀完</span>${a.published_at ? `<span>${esc(String(a.published_at).slice(0, 10).replace(/-/g, "."))}</span>` : ""}</div>
    ${a.cover ? `<div class="cover" role="img" aria-label="封面" style="background-image:url('${esc(img(a.cover))}')"></div>` : ""}
    <div class="body">${(a.blocks || []).map(blockHtml).join("")}</div>
    ${(a.tags || []).length ? `<div class="tags">${a.tags.map(t => `<span>#${esc(t)}</span>`).join("")}</div>` : ""}
    <div class="end">— FIN —</div>
  </article></div>
  ${preview ? `<div class="preview-flag">預覽（還沒發布，只有你看得到）</div>` : ""}`;
}
async function openArticle(id, fromEl) {
  let a = ARTICLES.find(x => x.id === id);
  let preview = false;
  if (!a && params.get("preview")) { try { a = await loadPreview(id); preview = !!a; } catch (e) {} }
  if (!a) { renderList(); return; }
  history.pushState({ id }, "", `?id=${encodeURIComponent(id)}${preview ? "&preview=1" : ""}`);
  const go = () => {
    $app.innerHTML = articleHtml(a, preview || (a.status && a.status !== "published"));
    document.title = `${a.title}｜${CONFIG.name || "TabigrAm.zine"}`;
    window.scrollTo(0, 0);
    document.getElementById("backBtn").addEventListener("click", closeArticle);
    if (!usingSample && !preview) track("zine_view", a.id);
  };
  if (fromEl && !reduced) { fromEl.style.transition = "transform .25s, opacity .25s"; fromEl.style.transform = "rotate(0) scale(1.03)"; setTimeout(go, 180); }
  else go();
}
function closeArticle() {
  const sh = document.querySelector(".sheet");
  const back = () => { history.pushState({}, "", location.pathname); renderList(); window.scrollTo(0, 0); };
  if (sh && !reduced) { sh.classList.remove("turn-in"); sh.classList.add("turn-out"); setTimeout(back, 380); } else back();
}
window.addEventListener("popstate", () => { const id = new URLSearchParams(location.search).get("id"); if (id) openArticle(id); else renderList(); });

const $app = document.getElementById("app");
(async () => {
  await loadConfig();
  const id = params.get("id");
  if (id && params.get("preview")) {
    try { const a = await loadPreview(id); if (a) { ARTICLES = [a]; $app.innerHTML = articleHtml(a, a.status !== "published"); document.getElementById("backBtn").addEventListener("click", () => { location.href = location.pathname; }); return; } } catch (e) {}
  }
  await loadArticles();
  track("zine_open");
  if (id) openArticle(id); else renderList();
})();
</script>
