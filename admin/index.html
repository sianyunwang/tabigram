<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>果醬派對管理｜TabigrAm</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
<style>
/* 果醬派對管理頁：沿用 App 的 Paper 主題（再生紙灰、國際橘） */
:root {
  --paper: #E7E5E0; --card: #F6F4F0; --card2: #EBE9E4; --ink: #191919; --sub: #6E6A63; --line: #D6D2CA;
  --accent: #FF4F00; --accent-soft: #FFE6DA; --ok: #16803C; --ok-soft: #E3F3E8; --danger: #C2381B;
  --display: 'Dela Gothic One', 'Noto Sans TC', system-ui, sans-serif;
  --sans: 'Noto Sans TC', 'PingFang TC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
a { color: inherit; }
button { font-family: var(--sans); }
.wrap { max-width: 980px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 12px; padding: 8px 0 22px; }
.ring { width: 40px; height: 40px; flex: none; background: var(--accent); -webkit-mask: url(../logo-ring.svg) center / contain no-repeat; mask: url(../logo-ring.svg) center / contain no-repeat; animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
.brand { font-family: var(--display); font-size: 22px; line-height: 1.1; }
.brand small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--accent); margin-top: 3px; }
.sp { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); min-width: 0; }
.who b { color: var(--ink); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 900; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; transition: transform .12s ease, background .12s ease; }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
.btn.dark { background: var(--ink); color: var(--paper); }
.btn.go { background: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border: 1.5px solid var(--ink); color: var(--ink); padding: 8.5px 16px; }
.btn.soft { background: var(--card2); color: var(--ink); }
.btn.sm { font-size: 13px; padding: 7px 13px; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid #E9B9AC; padding: 7px 13px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: progress; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4vw, 34px); margin: 0 0 6px; text-wrap: balance; }
h2 { font-size: 18px; font-weight: 900; margin: 0; }
.lead { color: var(--sub); margin: 0 0 22px; max-width: 40em; }
.kicker { font-family: var(--mono); font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--accent); }
.center { text-align: center; padding: 48px 22px; }
.center p { color: var(--sub); max-width: 30em; margin: 8px auto 20px; }

/* 貼紙包清單 */
.list { display: grid; gap: 12px; }
.pack { display: grid; grid-template-columns: 72px 1fr auto; gap: 16px; align-items: center; }
.cover { width: 72px; height: 72px; border-radius: 20px; background: var(--card2); border: 1.5px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.cover img { width: 62px; height: 62px; object-fit: contain; }
.pack-name { font-size: 17px; font-weight: 900; }
.pack-meta { font-size: 13px; color: var(--sub); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.off { background: var(--card2); color: var(--sub); }
.pack-strip { display: flex; gap: 4px; margin-top: 8px; overflow: hidden; }
.pack-strip img { width: 30px; height: 30px; object-fit: contain; border-radius: 8px; background: var(--card2); padding: 2px; }
.pack-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.order { display: flex; flex-direction: column; gap: 4px; }
.icon-btn { width: 34px; height: 34px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 15px; font-weight: 900; color: var(--ink); }
.icon-btn[disabled] { opacity: .3; cursor: default; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 12px; flex-wrap: wrap; }
.pill.star { background: var(--accent-soft); color: var(--accent); }

/* 分頁 */
.tabs { display: flex; gap: 6px; margin: -8px 0 18px; }
.tabs button { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 16px; font: 900 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tabs button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tab-n { font: 800 11px var(--mono); background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 7px; }
.tab-n:empty { display: none; }

/* 意見回饋 */
.fb-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font: 800 13px var(--sans); cursor: pointer; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.fb-search { flex: 1; min-width: 160px; font: 500 14px var(--sans); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px; background: #fff; color: var(--ink); }
.fb { display: grid; gap: 6px; }
.fb.done { opacity: .55; }
.fb-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--sub); }
.fb-cat { font-size: 11.5px; font-weight: 900; border-radius: 999px; padding: 2px 9px; }
.fb-cat.bug { background: #FBE3DD; color: #B23A20; }
.fb-cat.idea { background: #E4ECF8; color: #2C4F8A; }
.fb-cat.love { background: var(--ok-soft); color: var(--ok); }
.fb-cat.other { background: var(--card2); color: var(--sub); }
.fb-msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.65; }
.fb-info { font: 500 11.5px var(--mono); color: var(--sub); overflow-wrap: anywhere; }
.fb-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fb-foot .sp { flex: 1; }

/* 編輯 */
.editor { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12.5px; font-weight: 800; color: var(--sub); }
.field input { width: 100%; font: 500 15px var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.field input:focus { outline: none; border-color: var(--ink); }
.field .hint { font-size: 12px; color: var(--sub); }
.section { margin-top: 22px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.section-head p { margin: 0; font-size: 12.5px; color: var(--sub); }
.drop { display: block; border: 2px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; color: var(--sub); font-size: 13.5px; cursor: pointer; background: rgba(255,255,255,.4); transition: border-color .15s ease, background .15s ease; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop b { color: var(--ink); }
.cover-row { display: flex; gap: 14px; align-items: center; }
.cover-row .cover { width: 88px; height: 88px; border-radius: 24px; }
.cover-row .cover img { width: 78px; height: 78px; }
.stk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.stk { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 10px; display: grid; gap: 8px; }
.stk-img { height: 110px; border-radius: 12px; background: var(--card2); display: grid; place-items: center; position: relative; }
.stk-img img { max-width: 100%; max-height: 100px; object-fit: contain; }
.stk-no { position: absolute; top: 6px; left: 8px; font: 800 11px var(--mono); color: var(--sub); }
.stk-new { position: absolute; top: 6px; right: 8px; font-size: 10.5px; font-weight: 800; color: var(--accent); }
.stk input { width: 100%; font: 500 13.5px var(--sans); border: 1.5px solid var(--line); border-radius: 10px; padding: 7px 9px; color: var(--ink); background: var(--card); }
.stk input:focus { outline: none; border-color: var(--ink); }
.stk-tools { display: flex; gap: 6px; }
.stk-tools .icon-btn { width: 30px; height: 30px; border-radius: 10px; font-size: 13px; }
.stk-tools .rm { margin-left: auto; color: var(--danger); }
.save-bar { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); margin-top: 22px; background: var(--ink); color: var(--paper); border-radius: 20px; padding: 12px 14px 12px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.save-bar .msg { flex: 1; font-size: 13px; opacity: .85; min-width: 160px; }
.save-bar .btn.soft { background: rgba(255,255,255,.12); color: var(--paper); }

/* 右側：App 裡的樣子 */
.preview { position: sticky; top: 16px; }
.phone { background: #0E0F12; border-radius: 30px; padding: 14px; color: #fff; }
.phone-cap { font-size: 12px; color: rgba(255,255,255,.6); margin: 2px 4px 10px; }
.p-sheet { background: var(--card); color: var(--ink); border-radius: 20px; padding: 12px; }
.p-label { font-size: 11px; color: var(--sub); font-weight: 800; margin-bottom: 6px; }
.p-row { display: flex; gap: 8px; align-items: center; overflow: hidden; }
.p-cover { width: 56px; flex: none; display: grid; justify-items: center; gap: 3px; }
.p-cover span { width: 50px; height: 50px; border-radius: 15px; background: var(--card2); border: 1.5px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.p-cover img { width: 44px; height: 44px; object-fit: contain; }
.p-cover small { font-size: 9.5px; font-weight: 800; color: var(--sub); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-emo { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); flex: none; }
.p-jam { margin-top: 12px; background: var(--card); color: var(--ink); border-radius: 20px; padding: 14px; }
.p-jam-head { display: flex; gap: 10px; align-items: center; }
.p-jam-head .p-cover span { width: 54px; height: 54px; }
.p-name { font-size: 15px; font-weight: 900; line-height: 1.3; }
.p-by { font-size: 11.5px; color: var(--sub); }
.p-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 10px; }
.p-grid span { aspect-ratio: 1; border-radius: 10px; background: var(--card2); display: grid; place-items: center; padding: 3px; }
.p-grid img { width: 100%; height: 100%; object-fit: contain; }
.p-empty { font-size: 12px; color: var(--sub); padding: 10px 0; }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 50; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.skeleton { height: 96px; border-radius: 22px; background: linear-gradient(90deg, var(--card) 0%, var(--card2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sk 1.2s ease infinite; }
@keyframes sk { to { background-position: -200% 0; } }

@media (max-width: 820px) {
  .editor { grid-template-columns: 1fr; }
  .preview { position: static; }
}
@media (max-width: 560px) {
  .fields { grid-template-columns: 1fr; }
  .pack { grid-template-columns: 56px 1fr; }
  .cover { width: 56px; height: 56px; border-radius: 16px; }
  .cover img { width: 48px; height: 48px; }
  .pack-actions { grid-column: 1 / -1; justify-content: flex-start; }
  .order { flex-direction: row; }
  .who b { max-width: 110px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="ring" aria-hidden="true"></span>
    <div class="brand">果醬派對<small>JAM PARTY · ADMIN</small></div>
    <span class="sp"></span>
    <div class="who" id="who" hidden><b id="whoName"></b><button class="btn ghost sm" type="button" id="signOutBtn">登出</button></div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button type="button" data-tab="packs">貼紙包</button>
    <button type="button" data-tab="feedback">意見回饋 <span class="tab-n" id="fbCount"></span></button>
  </nav>
  <main id="app"><div class="skeleton"></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===== 設定（和 App 用同一個 Supabase 專案；這把是公開金鑰，權限由資料庫規則控管）=====
const SUPABASE_URL = "https://pjgjxvahhauqluassiuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_6FOfxpsIuTDrJq0BFCAW6w_uzp-IhVX";
const BUCKET = "stickers";
const MAX_SIDE = 512;              // 上傳前把圖縮到最長邊 512 像素（App 裡最大也只畫到 300）
// 內建的蛋白人貼紙（網站裡的檔案），可以一鍵搬進雲端
const BUILTIN_NAOBAO = {
  id: "naobao", name: "跟著蛋白一起去旅行", name_en: "Travel with naobao",
  artist: "蛋白人", artist_en: "naobao", url: "https://www.instagram.com/naobao_draw/", cover: "cover.png",
  items: [["01.png", "出發囉", "Let's GO"], ["02.png", "塊陶", "Hurry up"], ["03.png", "拍照就擺 pose", "Give you big heart"],
    ["04.png", "好吃還想再吃", "Yumyum"], ["05.png", "是免稅不是免費", "It's tax free, not for free"], ["06.png", "嚇一跳", "Bingbong"],
    ["07.png", "100 分", "Excellent"], ["08.png", "每天都值得慶祝", "Happy birthday"]],
};

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const publicUrl = path => `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${String(path).split("/").map(encodeURIComponent).join("/")}`;
let user = null, packs = [], draft = null;

function toast(msg, ms = 2600) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}

// ===== 登入與權限 =====
async function boot() {
  const { data } = await sb.auth.getSession();
  user = data.session ? data.session.user : null;
  if (!user) return renderSignIn();
  $("who").hidden = false;
  $("whoName").textContent = (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name)) || user.email || "";
  const { data: ok, error } = await sb.rpc("is_app_admin");
  if (error) return renderMessage("還沒完成設定", "找不到管理員設定。請先在 Supabase 的 SQL Editor 執行 SUPABASE_STICKER_ADMIN.sql。");
  if (!ok) return renderMessage("這個帳號不是管理員", "只有 TabigrAm 的管理員可以使用這一頁。如果你是管理員，請換成管理員的 Google 帳號登入。");
  $("tabs").hidden = false;
  document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
  loadFeedback().then(() => updateFbCount());
  await showTab(location.hash === "#feedback" ? "feedback" : "packs");
}
async function showTab(tab) {
  if (draft && hasUnsaved() && !confirm("編輯中的貼紙包還沒存，確定要離開？")) return;
  document.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  history.replaceState(null, "", tab === "feedback" ? "#feedback" : location.pathname);
  if (tab === "feedback") { draft = null; await loadFeedback(); renderFeedback(); }
  else { await loadPacks(); renderList(); }
}
$("signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !user) boot(); });

function renderSignIn() {
  $("app").innerHTML = `<section class="card center">
    <div class="kicker">ADMIN ONLY</div>
    <h1>管理果醬派對的貼紙包</h1>
    <p>用你的 TabigrAm 管理員帳號登入。登入後可以上傳新的貼紙包、上架或下架。</p>
    <button class="btn dark" type="button" id="googleBtn">使用 Google 帳號登入</button>
    <p style="font-size:12.5px; margin-top:16px;">如果按了沒反應或回到首頁，先到 <a href="../">TabigrAm</a> 登入，再回到這一頁。</p>
  </section>`;
  $("googleBtn").addEventListener("click", () => sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }));
}
function renderMessage(title, body) {
  $("app").innerHTML = `<section class="card center"><h1>${esc(title)}</h1><p>${esc(body)}</p><a class="btn ghost" href="../">回到 TabigrAm</a></section>`;
}

// ===== 貼紙包清單 =====
async function loadPacks() {
  const { data, error } = await sb.from("sticker_packs").select("*").order("sort", { ascending: true }).order("created_at", { ascending: true });
  if (error) { toast("讀取貼紙包失敗：" + error.message, 5000); packs = []; return; }
  packs = data || [];
}
function renderList() {
  draft = null;
  const hasNaobao = packs.some(p => p.id === "naobao");
  const rows = packs.map((p, i) => `<article class="card pack">
      <span class="cover">${p.cover ? `<img src="${esc(publicUrl(p.cover))}" alt="">` : ""}</span>
      <div style="min-width:0;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;"><span class="pack-name">${esc(p.name)}</span>${p.featured && p.published ? `<span class="pill star">★ 本季精選</span>` : ""}<span class="pill ${p.published ? "on" : "off"}">${p.published ? "● 已上架" : "草稿"}</span></div>
        <div class="pack-meta">${esc(p.name_en)} · 插畫：${esc(p.artist || "—")} · ${(p.items || []).length} 張</div>
        <div class="pack-strip">${(p.items || []).slice(0, 8).map(x => `<img src="${esc(publicUrl(x.path))}" alt="" loading="lazy">`).join("")}</div>
      </div>
      <div class="pack-actions">
        <div class="order"><button class="icon-btn" type="button" aria-label="往前" data-move="${i}:-1" ${i === 0 ? "disabled" : ""}>↑</button><button class="icon-btn" type="button" aria-label="往後" data-move="${i}:1" ${i === packs.length - 1 ? "disabled" : ""}>↓</button></div>
        <button class="btn soft sm" type="button" data-edit="${esc(p.id)}">編輯</button>
        ${p.published ? `<button class="btn ${p.featured ? "soft" : "ghost"} sm" type="button" data-feature="${esc(p.id)}">${p.featured ? "取消精選" : "★ 設為精選"}</button>` : ""}
        <button class="btn ${p.published ? "ghost" : "go"} sm" type="button" data-toggle="${esc(p.id)}">${p.published ? "下架" : "上架"}</button>
      </div>
    </article>`).join("");
  $("app").innerHTML = `
    <h1>貼紙包</h1>
    <p class="lead">上架的貼紙包會出現在果醬派對，使用者按「收藏」後才會出現在分享卡的「貼圖」裡。<b>本季精選</b>（建議最多 3 組）會排在果醬派對最前面，其他收在「看全部」。順序就是 App 裡顯示的順序。</p>
    <div class="bar"><span class="kicker">${packs.length} 包 · ${packs.filter(p => p.published).length} 包上架中</span><button class="btn go" type="button" id="newBtn">＋ 新增貼紙包</button></div>

// ===== 圖片處理：縮到最長邊 512、保留透明背景、轉成 PNG =====
function fileToImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => resolve({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("讀不到這張圖")); };
    img.src = url;
  });
}
async function prepImage(file) {
  if (!/^image\//.test(file.type)) throw new Error(`${file.name} 不是圖片`);
  const { img, url } = await fileToImage(file);
  const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  URL.revokeObjectURL(url);
  const blob = await new Promise(r => c.toBlob(r, "image/png"));
  if (blob.size > 1024 * 1024) throw new Error(`${file.name} 處理後還是超過 1MB`);
  return { blob, preview: URL.createObjectURL(blob), w, h, jpg: /jpe?g/i.test(file.type) };
}
const nameFromFile = f => f.name.replace(/\.[^.]+$/, "");
function splitName(base) {
  // 檔名寫成「中文:English」或「中文：English」時，自動拆成中英文名稱
  const m = base.split(/[:：]/);
  return m.length >= 2 ? [m[0].trim(), m.slice(1).join(":").trim()] : [base.trim(), ""];
}

const slugify = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);

async function savePack(publish) {
  readFields();
  const d = draft;
  if (!d.name) return toast("請填中文包名");
  if (!d.items.length) return toast("至少要有一張貼紙");
  if (d.url && !/^https:\/\//.test(d.url)) return toast("作品連結請用 https:// 開頭");
  if (d.items.some(x => !x.name)) return toast("每張貼紙都要有中文名稱");
  if (d.isNew) {
    d.id = slugify(d.id || d.name_en) || ("pack-" + Date.now().toString(36));
    if (packs.some(p => p.id === d.id)) return toast(`代號「${d.id}」已經有人用了，換一個`);
  }
  const buttons = document.querySelectorAll(".save-bar .btn"); buttons.forEach(b => b.disabled = true);
  const msg = $("saveMsg");
  try {
    const stamp = Date.now().toString(36);
    const up = async (blob, name) => {
      const path = `${d.id}/${stamp}-${name}.png`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/png", upsert: false, cacheControl: "31536000" });
      if (error) throw new Error("上傳圖片失敗：" + error.message);
      return path;
    };
    const toUpload = d.items.filter(x => x.blob).length + (d.cover && d.cover.blob ? 1 : 0);
    let done = 0;
    const tick = () => { msg.textContent = `上傳中… ${done}/${toUpload}`; };
    tick();
    if (d.cover && d.cover.blob) { d.cover.path = await up(d.cover.blob, "cover"); delete d.cover.blob; done++; tick(); }
    for (let i = 0; i < d.items.length; i++) {
      const x = d.items[i];
      if (x.blob) { x.path = await up(x.blob, String(i + 1).padStart(2, "0")); delete x.blob; done++; tick(); }
    }
    msg.textContent = "儲存中…";
    const row = {
      id: d.id, name: d.name, name_en: d.name_en || d.name, artist: d.artist, artist_en: d.artist_en || d.artist, url: d.url,
      cover: d.cover ? d.cover.path : d.items[0].path,
      items: d.items.map(x => ({ path: x.path, name: x.name, name_en: x.name_en || x.name })),
      published: !!publish, updated_at: new Date().toISOString(),
    };
    if (d.isNew) row.sort = (packs.length + 1) * 10;
    const { error } = d.isNew ? await sb.from("sticker_packs").insert(row) : await sb.from("sticker_packs").update(row).eq("id", d.id);
    if (error) throw new Error("儲存失敗：" + error.message);
    if (d.removed.length) await sb.storage.from(BUCKET).remove(d.removed); // 換掉的舊圖順手清掉
    toast(publish ? "已儲存並上架，App 重新整理後就看得到" : "已存成草稿");
    await loadPacks(); renderList();
  } catch (e) {
    toast(e.message, 6000);
    msg.textContent = "沒有儲存成功，可以再試一次。";
    buttons.forEach(b => b.disabled = false);
  }
}
async function deletePack() {
  const d = draft;
  if (!confirm(`確定要刪除「${d.name}」嗎？雲端上的圖片也會一起刪掉，沒辦法復原。`)) return;
  const { error } = await sb.from("sticker_packs").delete().eq("id", d.id);
  if (error) return toast("刪除失敗：" + error.message, 5000);
  const paths = [...d.items.map(x => x.path), d.cover && d.cover.path, ...d.removed].filter(Boolean);
  if (paths.length) await sb.storage.from(BUCKET).remove(paths);
  toast("已刪除");
  await loadPacks(); renderList();
}

// ===== 把網站裡內建的蛋白人搬進雲端（照原本的名稱和順序，直接上架）=====
async function importNaobao() {
  const btn = $("importBtn"); btn.disabled = true; btn.textContent = "搬運中…";
  try {
    const p = BUILTIN_NAOBAO, stamp = Date.now().toString(36);
    const grab = async f => { const r = await fetch(`../stickers/${p.id}/${f}`); if (!r.ok) throw new Error(`找不到 ${f}`); return r.blob(); };
    const put = async (blob, name) => { const path = `${p.id}/${stamp}-${name}.png`; const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: "image/png", cacheControl: "31536000" }); if (error) throw new Error(error.message); return path; };
    const cover = await put(await grab(p.cover), "cover");
    const items = [];
    for (let i = 0; i < p.items.length; i++) { const [f, zh, en] = p.items[i]; items.push({ path: await put(await grab(f), String(i + 1).padStart(2, "0")), name: zh, name_en: en }); btn.textContent = `搬運中… ${i + 1}/${p.items.length}`; }
    const { error } = await sb.from("sticker_packs").insert({ id: p.id, name: p.name, name_en: p.name_en, artist: p.artist, artist_en: p.artist_en, url: p.url, cover, items, sort: 10, published: true });
    if (error) throw new Error(error.message);
    toast("搬好了，已經上架");
    await loadPacks(); renderList();
  } catch (e) {
    toast("搬運失敗：" + e.message, 6000); btn.disabled = false; btn.textContent = "一鍵搬進來";
  }
}

boot().catch(e => renderMessage("出了點問題", String(e && e.message || e)));
</script>
