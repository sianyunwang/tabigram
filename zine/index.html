<style>
/* TabigrAm.zine：紙張質感的旅行小誌（測試版，還沒和 App 串在一起） */
:root {
  --paper: #EFEBE2; --ink: #1F1D1A; --sub: #6B655B; --line: rgba(31,29,26,.16);
  --accent: #FF4F00; --accent2: #2F6FDB; --tape: rgba(240, 214, 140, .78);
  --serif: 'Noto Serif TC', serif; --sans: 'Noto Sans TC', -apple-system, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  --paper-img: none; --paper-size: 512px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: var(--paper-img);
  background-size: var(--paper-size) var(--paper-size);
  color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.75;
  min-height: 100vh; overflow-x: hidden;
}
a { color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top, 0px)) 18px 80px; }

/* ===== 刊頭：孔版印刷的套色偏移，慢慢對準 ===== */
.mast { text-align: center; padding: 18px 0 8px; position: relative; }
.mast .kicker { font: 800 11px var(--mono); letter-spacing: .3em; color: var(--sub); }
.riso { position: relative; display: inline-block; font-family: var(--serif); font-weight: 900; font-size: clamp(44px, 11vw, 112px); line-height: 1; letter-spacing: -.02em; margin: 10px 0 6px; }
.riso span { display: block; }
.riso .l1 { color: var(--accent); mix-blend-mode: multiply; }
.riso .l2 { position: absolute; inset: 0; color: var(--accent2); mix-blend-mode: multiply; animation: register 2.4s cubic-bezier(.2,.8,.2,1) .2s both; }
.riso .l3 { position: absolute; inset: 0; color: var(--ink); opacity: .9; animation: inkin 1.2s ease 1.6s both; }
@keyframes register { from { transform: translate(7px, -5px) rotate(-.6deg); } to { transform: translate(1.5px, 1px); } }
@keyframes inkin { from { opacity: 0; } to { opacity: .9; } }
.mast .tag { font-family: var(--serif); font-size: 15px; color: var(--sub); margin-top: 14px; }
.mast .rule { display: flex; align-items: center; gap: 10px; margin: 18px auto 0; max-width: 560px; font: 700 11px var(--mono); color: var(--sub); letter-spacing: .12em; }
.mast .rule::before, .mast .rule::after { content: ""; flex: 1; border-top: 1.5px dashed var(--line); }

/* ===== 目錄：剪下來貼上去的卡片 ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 34px 26px; margin-top: 34px; }
.cut { position: relative; display: block; text-decoration: none; background: #FBF9F4; padding: 12px 12px 16px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 10px 24px -12px rgba(40,30,10,.35);
  transform: rotate(var(--rot, -1deg)); transition: transform .35s cubic-bezier(.3,1.4,.5,1), box-shadow .3s; cursor: pointer; border: 0; text-align: left; font: inherit; color: inherit; width: 100%; }
.cut:hover, .cut:focus-visible { transform: rotate(0deg) translateY(-4px); box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 34px -14px rgba(40,30,10,.45); outline: none; }
.cut::before, .cut::after { content: ""; position: absolute; width: 78px; height: 24px; background: var(--tape); top: -11px; box-shadow: 0 1px 2px rgba(0,0,0,.08); opacity: .95;
  -webkit-mask: linear-gradient(90deg, transparent 0 3px, #000 3px calc(100% - 3px), transparent 0), repeating-linear-gradient(0deg, #000 0 2px, transparent 2px 3px); mask: linear-gradient(90deg, transparent 0 3px, #000 3px calc(100% - 3px), transparent 0); }
.cut::before { left: 18px; transform: rotate(-6deg); }
.cut::after { right: 18px; transform: rotate(5deg); }
.cut .img { aspect-ratio: 16 / 10; background: #D9D3C7 center / cover no-repeat; filter: saturate(.92) contrast(1.02); }
.cut .meta { font: 700 11px var(--mono); color: var(--accent); letter-spacing: .08em; margin-top: 12px; }
.cut h2 { font-family: var(--serif); font-size: 22px; line-height: 1.35; margin: 4px 0 4px; }
.cut p { margin: 0; color: var(--sub); font-size: 14px; line-height: 1.6; }
.cut .by { margin-top: 10px; font-size: 12.5px; color: var(--sub); display: flex; justify-content: space-between; gap: 8px; }
.cut .feat { position: absolute; right: 18px; top: 22px; z-index: 1; background: var(--accent); color: #fff; font: 800 11px var(--mono); padding: 4px 9px; transform: rotate(4deg); letter-spacing: .08em; }
/* 捲到才「貼上去」 */
.cut.pre { opacity: 0; transform: translateY(-26px) rotate(calc(var(--rot, -1deg) * 4)) scale(1.04); }
.cut.land { animation: land .7s cubic-bezier(.25,1.5,.45,1) both; }
@keyframes land { from { opacity: 0; transform: translateY(-26px) rotate(calc(var(--rot, -1deg) * 4)) scale(1.04); } 60% { opacity: 1; } to { opacity: 1; transform: rotate(var(--rot, -1deg)); } }

/* ===== 文章頁：翻頁 ===== */
.stage { perspective: 2200px; }
.sheet { background: #FBF9F4; max-width: 720px; margin: 24px auto 0; padding: clamp(22px, 5vw, 56px) clamp(18px, 6vw, 64px) 56px; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 30px 60px -30px rgba(40,30,10,.45); position: relative; transform-origin: left center; }
.sheet.turn-in { animation: turnin .75s cubic-bezier(.2,.8,.2,1) both; }
.sheet.turn-out { animation: turnout .45s cubic-bezier(.6,0,.8,.4) both; }
@keyframes turnin { from { transform: rotateY(-78deg) translateX(-4%); opacity: .3; box-shadow: 40px 30px 60px -20px rgba(40,30,10,.35); } to { transform: none; opacity: 1; } }
@keyframes turnout { to { transform: rotateY(-70deg); opacity: 0; } }
.sheet .back { border: 0; background: none; font: 700 13px var(--mono); color: var(--sub); cursor: pointer; padding: 0; letter-spacing: .06em; }
.sheet .issue { font: 800 11px var(--mono); color: var(--accent); letter-spacing: .14em; margin-top: 22px; }
.sheet h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(28px, 6vw, 44px); line-height: 1.25; margin: 8px 0 10px; text-wrap: balance; }
.sheet .lede { font-family: var(--serif); font-size: 18px; color: var(--sub); margin: 0 0 16px; text-wrap: pretty; }
.sheet .byline { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--sub); border-top: 1.5px dashed var(--line); border-bottom: 1.5px dashed var(--line); padding: 8px 0; margin-bottom: 26px; }
.sheet .cover { aspect-ratio: 16 / 10; background: #D9D3C7 center / cover no-repeat; margin: 0 calc(clamp(18px, 6vw, 64px) * -.4) 28px; }
.sheet .body p { margin: 0 0 1.1em; text-wrap: pretty; }
.sheet figure { margin: 30px 0; position: relative; }
.sheet figure img { width: 100%; display: block; transform: rotate(var(--rot, .8deg)); box-shadow: 0 10px 24px -14px rgba(40,30,10,.5); background: #fff; padding: 8px 8px 8px; }
.sheet figure::before { content: ""; position: absolute; z-index: 1; left: 50%; top: -10px; width: 90px; height: 22px; margin-left: -45px; background: var(--tape); transform: rotate(-3deg); }
.sheet figcaption { font-size: 13px; color: var(--sub); margin-top: 12px; text-align: center; font-family: var(--serif); }
.sheet blockquote { margin: 30px 0; padding: 0 0 0 18px; border-left: 4px solid var(--accent); font-family: var(--serif); font-size: 21px; line-height: 1.6; }
.sheet blockquote cite { display: block; font-style: normal; font-size: 13px; color: var(--sub); margin-top: 8px; font-family: var(--sans); }
.ticket { margin: 28px 0; background: #FFF8E6; border: 1.5px dashed rgba(31,29,26,.3); border-radius: 6px; padding: 14px 16px 14px 56px; position: relative; }
.ticket::before { content: "TIP"; position: absolute; left: 12px; top: 14px; font: 800 11px var(--mono); color: var(--accent); writing-mode: vertical-rl; letter-spacing: .2em; }
.ticket b { display: block; font-family: var(--serif); font-size: 17px; }
.ticket p { margin: 4px 0 0 !important; color: var(--sub); font-size: 14.5px; }
.place { margin: 28px 0; display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; background: #fff; padding: 14px 16px; box-shadow: 0 8px 18px -12px rgba(40,30,10,.4); transform: rotate(-.4deg); }
.place .pin { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font: 900 18px var(--sans); }
.place b { font-family: var(--serif); font-size: 18px; }
.place p { margin: 2px 0 0 !important; color: var(--sub); font-size: 14.5px; }
.place a { font: 700 12.5px var(--mono); color: var(--accent2); }
.sheet .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 30px; }
.sheet .tags span { font: 700 12px var(--mono); background: #EDE8DD; padding: 3px 9px; border-radius: 999px; color: var(--sub); }
.sheet .end { text-align: center; margin-top: 40px; font: 700 12px var(--mono); color: var(--sub); letter-spacing: .3em; }
.preview-flag { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: #fff; font: 700 12px var(--mono); padding: 6px 12px; border-radius: 999px; }
.foot { text-align: center; margin-top: 60px; font-size: 12.5px; color: var(--sub); }
.foot a { color: var(--ink); }
.empty { text-align: center; color: var(--sub); padding: 60px 0; font-family: var(--serif); }
.nav { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 18px auto 0; max-width: 820px; }
.nav a, .nav button { font: 700 12.5px var(--mono); letter-spacing: .04em; color: var(--ink); text-decoration: none; background: rgba(251,249,244,.75); border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.nav a.on, .nav button.on { background: var(--ink); color: #FBF9F4; border-color: var(--ink); }
.tagbar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 14px auto 0; max-width: 820px; }
.tagbar a { font: 700 12.5px var(--mono); color: var(--sub); text-decoration: none; background: #EDE8DD; padding: 3px 10px; border-radius: 999px; }
.tagbar a:hover, .tagbar a.on { background: var(--ink); color: #FBF9F4; }
.tagbar a small { opacity: .6; margin-left: 3px; }
.issue-head { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 26px; align-items: center; margin-top: 30px; }
.issue-head .cv { aspect-ratio: 16 / 10; background: #D9D3C7 center / cover no-repeat; box-shadow: 0 16px 34px -18px rgba(40,30,10,.5); transform: rotate(-1.2deg); position: relative; }
.issue-head .cv::before { content: ""; position: absolute; left: 40%; top: -11px; width: 92px; height: 24px; background: var(--tape); transform: rotate(-4deg); }
.issue-head .no { font: 800 13px var(--mono); color: var(--accent); letter-spacing: .16em; }
.issue-head h2 { font-family: var(--serif); font-weight: 900; font-size: clamp(28px, 5vw, 44px); line-height: 1.2; margin: 6px 0 10px; }
.issue-head p { margin: 0; color: var(--sub); font-family: var(--serif); font-size: 16px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 56px 0 4px; font: 800 12px var(--mono); letter-spacing: .2em; color: var(--sub); }
.sec-h::after { content: ""; flex: 1; border-top: 1.5px dashed var(--line); }
.shelf { display: flex; gap: 18px; overflow-x: auto; padding: 22px 4px 18px; scroll-snap-type: x proximity; }
.book { flex: none; width: 150px; text-decoration: none; color: inherit; scroll-snap-align: start; }
.book .bc { aspect-ratio: 3 / 4; background: #CFC7B8 center / cover no-repeat; box-shadow: 4px 6px 0 rgba(31,29,26,.12), 0 12px 22px -14px rgba(40,30,10,.5); border-left: 6px solid var(--bk, #1F1D1A); transition: transform .3s cubic-bezier(.3,1.4,.5,1); position: relative; display: flex; align-items: flex-end; }
.book:hover .bc { transform: translateY(-6px) rotate(-1.5deg); }
.book .bc span { background: #FBF9F4; font: 800 12px var(--mono); padding: 3px 8px; margin: 0 0 10px 8px; letter-spacing: .1em; }
.book b { display: block; font-family: var(--serif); font-size: 15px; margin-top: 10px; line-height: 1.35; }
.book small { color: var(--sub); font-size: 12px; }
.save { position: absolute; z-index: 2; left: 18px; top: 22px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(251,249,244,.92); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }

.save.on svg { fill: var(--accent); stroke: var(--accent); }

.save-btn.on { background: var(--ink); color: #FBF9F4; border-color: var(--ink); }
.save-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
.save-btn.on svg { fill: currentColor; }
.sheet .tags a { font: 700 12px var(--mono); background: #EDE8DD; padding: 3px 9px; border-radius: 999px; color: var(--sub); text-decoration: none; }
.sheet .tags a:hover { background: var(--ink); color: #FBF9F4; }
.page-h { text-align: center; margin-top: 30px; }
.page-h .kicker { font: 800 11px var(--mono); letter-spacing: .3em; color: var(--sub); }
.page-h h2 { font-family: var(--serif); font-weight: 900; font-size: clamp(26px, 5vw, 40px); margin: 6px 0 4px; }
.page-h p { margin: 0; color: var(--sub); font-family: var(--serif); }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #FBF9F4; font: 700 13px var(--sans); padding: 9px 16px; border-radius: 999px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 720px) { .issue-head { grid-template-columns: 1fr; gap: 18px; } }
/* 作者選的字型（後台「標題字型」「內文字型」）*/
.sheet h1, .sheet .lede, .sheet blockquote { font-family: var(--tfont, var(--serif)); }
.sheet .body p { font-family: var(--bfont, inherit); }
.cut h2 { font-family: var(--tfont, var(--serif)); }
@media (prefers-reduced-motion: reduce) {
  .riso .l2, .riso .l3, .cut.land, .sheet.turn-in, .sheet.turn-out { animation: none !important; }
  .riso .l2 { transform: translate(1.5px, 1px); } .riso .l3 { opacity: .9; }
  .cut.pre { opacity: 1; transform: rotate(var(--rot, -1deg)); }
}
</style>

  { id: "sample-tokyo", issue_id: "sample-2025-autumn", issue: "城市切片", title: "東京，用一張地鐵票", subtitle: "從中目黑到淺草，銀座線轉日比谷線，一天的城市切片。", author_name: "TabigrAm 編輯部", read_minutes: 1, cover: "../sample-route-card.jpg", tags: ["東京", "地鐵", "秋天"], blocks: [{ type: "text", text: "這是一篇範例文章。在後台「Zine」新增文章、送審、發布之後，這裡就會換成真的內容。" }] },
];

let CONFIG = { name: "TabigrAm.zine", paper: "", paper_scale: 512, accent: "#FF4F00" };
let ARTICLES = [], ISSUES = [], usingSample = false;

// ===== 匿名統計（和 App 同一套：只有次數）=====
function track(e, d) {
  try {
    if (navigator.doNotTrack === "1" || navigator.globalPrivacyControl === true) return;
    fetch(`${SUPABASE_URL}/rest/v1/rpc/track`, { method: "POST", keepalive: true, headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify({ events: [d ? { e, d: String(d).replace(/[^A-Za-z0-9_.:/-]/g, "").slice(0, 40) } : { e }] }) }).catch(() => {});
  } catch (e) {}
}

// ===== 儲存（先存在這台裝置；之後和 TabigrAm 帳號同步）=====
const SAVE_KEY = "TG_ZINE_SAVED";
function savedIds() { try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function isSaved(id) { return savedIds().includes(id); }
function toggleSave(id) {
  const ids = savedIds(), i = ids.indexOf(id);
  if (i >= 0) { ids.splice(i, 1); toast("已取消儲存"); }
  else { ids.unshift(id); toast("已儲存，在「已儲存」找得到"); track("zine_save", id); }
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(ids.slice(0, 200))); } catch (e) {}
  document.querySelectorAll(`[data-save="${CSS.escape(id)}"]`).forEach(b => { b.classList.toggle("on", i < 0); b.setAttribute("aria-pressed", String(i < 0)); if (b.classList.contains("save-btn")) b.lastChild.textContent = i < 0 ? " 已儲存" : " 儲存"; });
  const n = document.getElementById("navSavedN"); if (n) n.textContent = savedIds().length || "";
}
const BOOKMARK = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"/></svg>`;
function toast(t) { let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 2200); }

// ===== 讀資料 =====
async function getJSON(url) {
  const r = await Promise.race([fetch(url, { headers: H }), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))]);
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function loadAll() {
  const [cfg, arts, iss] = await Promise.allSettled([
    getJSON(`${SUPABASE_URL}/rest/v1/app_config?select=value&key=eq.zine`),
    getJSON(`${SUPABASE_URL}/rest/v1/zine_articles?select=id,issue_id,title,subtitle,issue,author_name,author_url,cover,blocks,tags,read_minutes,featured,published_at,style&status=eq.published&order=featured.desc,sort.asc,published_at.desc`),
    getJSON(`${SUPABASE_URL}/rest/v1/zine_issues?select=*&published=eq.true&starts_on=lte.${today}&order=starts_on.desc`),
  ]);
  if (cfg.status === "fulfilled" && cfg.value[0] && cfg.value[0].value) CONFIG = { ...CONFIG, ...cfg.value[0].value };
  ARTICLES = arts.status === "fulfilled" ? arts.value : [];
  ISSUES = iss.status === "fulfilled" ? iss.value : [];
  if (!ARTICLES.length) { ARTICLES = SAMPLE; ISSUES = SAMPLE_ISSUES; usingSample = true; }
}
// 作者、管理員預覽草稿：用登入狀態讀（和 TabigrAm 同一個網站，登入會共用）
async function loadPreview(id) {
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data } = await sb.from("zine_articles").select("*").eq("id", id).maybeSingle();
  return data;
}

// ===== 紙張、主色：當期有自己的就用當期的 =====
function applyLook(issue) {
  const paper = (issue && issue.paper) || CONFIG.paper;
  document.documentElement.style.setProperty("--paper-img", paper ? cssUrl(img(paper)) : cssUrl(SAMPLE_PAPER));
  document.documentElement.style.setProperty("--paper-size", `${Number((issue && issue.paper && issue.paper_scale) || CONFIG.paper_scale) || 512}px`);
  document.documentElement.style.setProperty("--accent", safeColor((issue && issue.accent) || CONFIG.accent, "#FF4F00"));
}
const issueById = id => ISSUES.find(x => x.id === id);
const currentIssue = () => ISSUES.filter(x => x.starts_on <= today).sort((a, b) => b.starts_on.localeCompare(a.starts_on))[0] || null;
const issueNo = x => `No.${String(x.number).padStart(2, "0")} ${esc(x.name || SEASON[x.season] || "")}`;

// ===== 字型：只用後台清單裡的開源字型，用到才載入 =====
const FONTS = {
  serif: { family: "Noto Serif TC", q: "Noto+Serif+TC:wght@500;700;900" },
  sans: { family: "Noto Sans TC", q: "Noto+Sans+TC:wght@400;700;900" },
  kai: { family: "LXGW WenKai TC", q: "LXGW+WenKai+TC:wght@400;700" },
  round: { family: "Huninn", q: "Huninn" },
  hand: { family: "Iansui", q: "Iansui" },
};
function fontVars(a) {
  const st = (a && a.style) || {}, out = [];
  for (const [k, v] of [["tfont", st.title_font], ["bfont", st.body_font]]) {
    const f = FONTS[v]; if (!f) continue;
    if (!document.getElementById("font-" + v)) { const l = document.createElement("link"); l.id = "font-" + v; l.rel = "stylesheet"; l.href = `https://fonts.googleapis.com/css2?family=${f.q}&display=swap`; document.head.appendChild(l); }
    out.push(`--${k}:'${f.family}', serif`);
  }
  return out.join(";");
}

// ===== 文字 =====
function rich(t) { return String(t || "").split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\n/g, "<br>")}</p>`).join(""); }
function blockHtml(b, i) {
  const rot = ((i * 37) % 5 - 2) * .35;
  if (b.type === "text") return rich(b.text);
  if (b.type === "image" && b.src) return `<figure style="--rot:${rot}deg"><img src="${esc(img(b.src))}" alt="${esc(b.caption || "")}" loading="lazy">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ""}</figure>`;
  if (b.type === "quote") return `<blockquote>${esc(b.text)}${b.by ? `<cite>— ${esc(b.by)}</cite>` : ""}</blockquote>`;
  if (b.type === "tip") return `<div class="ticket"><b>${esc(b.title || "")}</b><p>${esc(b.text || "")}</p></div>`;
  if (b.type === "place") return `<div class="place"><span class="pin">●</span><div><b>${esc(b.title || "")}</b><p>${esc(b.text || "")}</p>${safeHttps(b.link) ? `<a href="${esc(b.link)}" target="_blank" rel="noopener">打開地圖 ↗</a>` : ""}</div></div>`;
  return "";
}

// ===== 共用：刊頭、導覽、卡片 =====
function mastHtml() {
  const name = CONFIG.name || "TabigrAm.zine";
  return `<header class="mast">
      <div class="kicker">A TINY TRAVEL ZINE</div>
      <div class="riso" aria-label="${esc(name)}"><span class="l1">${esc(name)}</span><span class="l2" aria-hidden="true">${esc(name)}</span><span class="l3" aria-hidden="true">${esc(name)}</span></div>
      <div class="tag">一分鐘讀完的旅行小誌：一個提案、一件好物、一個好地方。</div>
      ${usingSample ? `<div class="rule">範例內容 · SAMPLE</div>` : ""}
    </header>`;
}
function navHtml(on) {
  const n = savedIds().length;
  return `<nav class="nav" aria-label="Zine">
      <a href="./" class="${on === "home" ? "on" : ""}" data-go="">本期</a>
      ${ISSUES.length > 1 ? `<a href="./#shelf" class="${on === "shelf" ? "on" : ""}" data-go="#shelf">往期書架</a>` : ""}
      <a href="?saved=1" class="${on === "saved" ? "on" : ""}" data-go="?saved=1">已儲存 <span id="navSavedN">${n || ""}</span></a>
    </nav>`;
}
function tagBarHtml(active) {
  const m = {};
  ARTICLES.forEach(a => (a.tags || []).forEach(t => { m[t] = (m[t] || 0) + 1; }));
  const tags = Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 18);
  return tags.length ? `<div class="tagbar">${tags.map(([t, n]) => `<a href="?tag=${encodeURIComponent(t)}" class="${t === active ? "on" : ""}" data-go="?tag=${encodeURIComponent(t)}">#${esc(t)}<small>${n}</small></a>`).join("")}</div>` : "";
}
function cardHtml(a, i) {
  const iss = issueById(a.issue_id);
  return `<div style="position:relative;"><button type="button" class="cut ${reduced ? "" : "pre"}" style="--rot:${(((i * 53) % 7) - 3) * .5}deg;${fontVars(a)}" data-id="${esc(a.id)}">
      ${a.featured ? `<span class="feat">PICK</span>` : ""}
      <div class="img" style="background-image:${cssUrl(img(a.cover))}"></div>
      <div class="meta">${iss ? `${issueNo(iss)}` : ""}${iss && a.issue ? " · " : ""}${esc(a.issue || (iss ? "" : "TabigrAm.zine"))}</div>
      <h2>${esc(a.title)}</h2>
      <p>${esc(a.subtitle || "")}</p>
      <div class="by"><span>文・${esc(a.author_name || "")}</span><span>${Number(a.read_minutes) || 1} min</span></div>
    </button><button type="button" class="save ${isSaved(a.id) ? "on" : ""}" data-save="${esc(a.id)}" aria-pressed="${isSaved(a.id)}" aria-label="儲存">${BOOKMARK}</button></div>`;
}
function gridHtml(list) { return `<section class="grid">${list.map(cardHtml).join("") || `<div class="empty">這裡還沒有文章</div>`}</section>`; }
function bookHtml(x) {
  return `<a class="book" href="?issue=${encodeURIComponent(x.id)}" data-go="?issue=${encodeURIComponent(x.id)}" style="--bk:${safeColor(x.accent, "#1F1D1A")}"><div class="bc" style="background-image:${cssUrl(img(x.cover))}"><span>${issueNo(x)}</span></div><b>${esc(x.title || "")}</b><small>${esc(String(x.starts_on).slice(0, 7).replace("-", "."))} · ${ARTICLES.filter(a => a.issue_id === x.id).length} 篇</small></a>`;
}
function wire() {
  document.querySelectorAll(".cut[data-id]").forEach(c => c.addEventListener("click", () => openArticle(c.dataset.id, c)));
  document.querySelectorAll("[data-save]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); toggleSave(b.dataset.save); }));
  document.querySelectorAll("[data-go]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); go(a.dataset.go); }));
  if (!reduced && "IntersectionObserver" in window) {
    let n = 0;
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const el = e.target;
      setTimeout(() => { el.classList.remove("pre"); el.classList.add("land"); }, (n++ % 6) * 110);
    }), { threshold: .15 });
    document.querySelectorAll(".cut.pre").forEach(c => io.observe(c));
  } else document.querySelectorAll(".cut.pre").forEach(c => c.classList.remove("pre"));
}

// ===== 各頁 =====
function renderHome() {
  const cur = currentIssue();
  applyLook(cur);
  document.title = CONFIG.name || "TabigrAm.zine";
  let body = "";
  if (cur) {
    const mine = ARTICLES.filter(a => a.issue_id === cur.id);
    const lastYear = ISSUES.filter(x => x.season === cur.season && x.season !== "special" && Number(x.year) === Number(cur.year) - 1);
    const lastYearArts = ARTICLES.filter(a => lastYear.some(x => x.id === a.issue_id));
    const past = ISSUES.filter(x => x.id !== cur.id);
    const loose = ARTICLES.filter(a => !a.issue_id);
    body = `<section class="issue-head">
        <div class="cv" role="img" aria-label="${esc(cur.title || "")}" style="background-image:${cssUrl(img(cur.cover))}"></div>
        <div><div class="no">${issueNo(cur)} · 當季號</div><h2>${esc(cur.title || "")}</h2>${cur.intro ? `<p>${esc(cur.intro)}</p>` : ""}</div>
      </section>
      ${gridHtml(mine.length ? mine : loose)}
      ${lastYearArts.length ? `<div class="sec-h">去年${esc(SEASON[cur.season] || "")}天</div>${gridHtml(lastYearArts)}` : ""}
      ${past.length ? `<div class="sec-h" id="shelf">往期書架</div><div class="shelf">${past.map(bookHtml).join("")}</div>` : ""}`;
  } else body = gridHtml(ARTICLES);
  $app.innerHTML = mastHtml() + navHtml("home") + tagBarHtml("") + body + footHtml();
  wire();
  if (location.hash === "#shelf") document.getElementById("shelf")?.scrollIntoView({ behavior: reduced ? "auto" : "smooth" });
}
function renderIssue(id) {
  const x = issueById(id);
  if (!x) return renderHome();
  applyLook(x);
  document.title = `${x.title || issueNo(x)}｜${CONFIG.name || "TabigrAm.zine"}`;
  $app.innerHTML = mastHtml() + navHtml("shelf") + `<section class="issue-head">
      <div class="cv" role="img" aria-label="${esc(x.title || "")}" style="background-image:${cssUrl(img(x.cover))}"></div>
      <div><div class="no">${issueNo(x)}${x.id === (currentIssue() || {}).id ? " · 當季號" : " · 往期"}</div><h2>${esc(x.title || "")}</h2>${x.intro ? `<p>${esc(x.intro)}</p>` : ""}</div>
    </section>` + gridHtml(ARTICLES.filter(a => a.issue_id === x.id)) + footHtml();
  wire();
}
function renderTag(tag) {
  applyLook(currentIssue());
  document.title = `#${tag}｜${CONFIG.name || "TabigrAm.zine"}`;
  const list = ARTICLES.filter(a => (a.tags || []).includes(tag));
  $app.innerHTML = mastHtml() + navHtml("") + tagBarHtml(tag) + `<div class="page-h"><div class="kicker">TAG</div><h2>#${esc(tag)}</h2><p>${list.length} 篇</p></div>` + gridHtml(list) + footHtml();
  wire();
}
function renderSaved() {
  applyLook(currentIssue());
  document.title = `已儲存｜${CONFIG.name || "TabigrAm.zine"}`;
  const ids = savedIds(), list = ids.map(id => ARTICLES.find(a => a.id === id)).filter(Boolean);
  $app.innerHTML = mastHtml() + navHtml("saved") + `<div class="page-h"><div class="kicker">SAVED</div><h2>已儲存</h2><p>${list.length ? `${list.length} 篇・存在這台裝置上` : "還沒有儲存的文章。看到喜歡的，按右上角的書籤。"}</p></div>` + (list.length ? gridHtml(list) : "") + footHtml();
  wire();
}
const footHtml = () => `<div class="foot">由 <a href="../">TabigrAm</a> 出版 · 測試版</div>`;

// ===== 文章 =====
function articleHtml(a, preview) {
  const iss = issueById(a.issue_id);
  const au = safeHttps(a.author_url);
  return `<div class="stage"><article class="sheet ${reduced ? "" : "turn-in"}" style="${fontVars(a)}">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <button type="button" class="back" id="backBtn">← ${esc(CONFIG.name || "TabigrAm.zine")}</button>
      ${preview ? "" : `<button type="button" class="save-btn ${isSaved(a.id) ? "on" : ""}" data-save="${esc(a.id)}" aria-pressed="${isSaved(a.id)}">${BOOKMARK}<span> ${isSaved(a.id) ? "已儲存" : "儲存"}</span></button>`}
    </div>
    <div class="issue">${iss ? `<a href="?issue=${encodeURIComponent(iss.id)}" data-go="?issue=${encodeURIComponent(iss.id)}" style="text-decoration:none;">${issueNo(iss)}</a>` : ""}${iss && a.issue ? " · " : ""}${esc(a.issue || (iss ? "" : "TabigrAm.zine"))}</div>
    <h1>${esc(a.title)}</h1>
    ${a.subtitle ? `<p class="lede">${esc(a.subtitle)}</p>` : ""}
    <div class="byline"><span>文・${au ? `<a href="${esc(au)}" target="_blank" rel="noopener">${esc(a.author_name)}</a>` : esc(a.author_name || "")}</span><span>${Number(a.read_minutes) || 1} 分鐘讀完</span>${a.published_at ? `<span>${esc(String(a.published_at).slice(0, 10).replace(/-/g, "."))}</span>` : ""}</div>
    ${a.cover ? `<div class="cover" role="img" aria-label="封面" style="background-image:${cssUrl(img(a.cover))}"></div>` : ""}
    <div class="body">${(a.blocks || []).map(blockHtml).join("")}</div>
    ${(a.tags || []).length ? `<div class="tags">${a.tags.map(t => `<a href="?tag=${encodeURIComponent(t)}" data-go="?tag=${encodeURIComponent(t)}">#${esc(t)}</a>`).join("")}</div>` : ""}
    ${preview ? "" : `<div style="text-align:center; margin-top:34px;"><button type="button" class="save-btn ${isSaved(a.id) ? "on" : ""}" data-save="${esc(a.id)}" aria-pressed="${isSaved(a.id)}">${BOOKMARK}<span> ${isSaved(a.id) ? "已儲存" : "儲存"}</span></button></div>`}
    <div class="end">— FIN —</div>
  </article></div>
  ${preview ? `<div class="preview-flag">預覽（還沒發布，只有你看得到）</div>` : ""}`;
}
async function openArticle(id, fromEl, pushed) {
  let a = ARTICLES.find(x => x.id === id), preview = false;
  if (!a && params().get("preview")) { try { a = await loadPreview(id); preview = !!a; } catch (e) {} }
  if (!a) { renderHome(); return; }
  if (!pushed) history.pushState({}, "", `?id=${encodeURIComponent(id)}${preview ? "&preview=1" : ""}`);
  const show = () => {
    applyLook(issueById(a.issue_id) || currentIssue());
    $app.innerHTML = articleHtml(a, preview || (a.status && a.status !== "published"));
    document.title = `${a.title}｜${CONFIG.name || "TabigrAm.zine"}`;
    window.scrollTo(0, 0);
    document.getElementById("backBtn").addEventListener("click", closeArticle);
    wire();
    if (!usingSample && !preview) track("zine_view", a.id);
  };
  if (fromEl && !reduced) { fromEl.style.transition = "transform .25s, opacity .25s"; fromEl.style.transform = "rotate(0) scale(1.03)"; setTimeout(show, 180); } else show();
}
function closeArticle() {
  const sh = document.querySelector(".sheet");
  const back = () => { if (history.length > 1 && document.referrer.includes(location.host)) history.back(); else go(""); };
  if (sh && !reduced) { sh.classList.remove("turn-in"); sh.classList.add("turn-out"); setTimeout(back, 380); } else back();
}

// ===== 路由 =====
function go(q) { history.pushState({}, "", q ? (q.startsWith("#") ? location.pathname + q : q) : location.pathname); route(); window.scrollTo(0, 0); }
function route() {
  const p = params();
  if (p.get("id")) return openArticle(p.get("id"), null, true);
  if (p.get("issue")) return renderIssue(p.get("issue"));
  if (p.get("tag")) return renderTag(p.get("tag"));
  if (p.get("saved")) return renderSaved();
  renderHome();
}
window.addEventListener("popstate", route);

const $app = document.getElementById("app");
(async () => {
  applyLook(null);
  const p = params(), id = p.get("id");
  if (id && p.get("preview")) {
    try { const a = await loadPreview(id); if (a) { ARTICLES = [a]; $app.innerHTML = articleHtml(a, a.status !== "published"); document.getElementById("backBtn").addEventListener("click", () => { location.href = location.pathname; }); return; } } catch (e) {}
  }
  await loadAll();
  track("zine_open");
  route();
})();
</script>
</body>
